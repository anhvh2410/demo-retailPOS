<style>
/* Bố cục: khung quản trị (thanh menu trái + nội dung), màn POS hai cột giỏ hàng / danh mục */
:root {
  --bg: #f4f6fa; --surface: #ffffff; --surface-2: #f8fafc; --line: #e3e8f0; --line-strong: #cbd3df;
  --fg: #0f172a; --muted: #5b6577; --faint: #94a0b3;
  --brand: #1b64e0; --brand-strong: #1650b5; --brand-soft: #eaf2ff; --on-brand: #ffffff;
  --good: #047857; --good-soft: #e7f6ef; --warn: #b45309; --warn-soft: #fdf3e2; --bad: #c62828; --bad-soft: #fdecec;
  --shopee: #ee4d2d; --tiktok: #111827; --lazada: #1a2d8f;
  --font-ui: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", sans-serif;

}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0d1220; --surface: #151c2c; --surface-2: #1a2235; --line: #263049; --line-strong: #34405c;
  --fg: #e8edf6; --muted: #a2adc2; --faint: #6c7892;
  --brand: #5b95f7; --brand-strong: #84aff9; --brand-soft: #1b2a48; --on-brand: #0b1220;
  --good: #4ade9a; --good-soft: #12301f; --warn: #f4b453; --warn-soft: #33260f; --bad: #f87171; --bad-soft: #3a1717;
  --tiktok: #e8edf6; --lazada: #8b9cf5;
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #0d1220; --surface: #151c2c; --surface-2: #1a2235; --line: #263049; --line-strong: #34405c;
  --fg: #e8edf6; --muted: #a2adc2; --faint: #6c7892;
  --brand: #5b95f7; --brand-strong: #84aff9; --brand-soft: #1b2a48; --on-brand: #0b1220;
  --good: #4ade9a; --good-soft: #12301f; --warn: #f4b453; --warn-soft: #33260f; --bad: #f87171; --bad-soft: #3a1717;

}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-ui); font-size: 14px; line-height: 1.5; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--font-mono); font-size: 12px; }
h1, h2, h3 { margin: 0; text-wrap: balance; }

/* ---------- đăng nhập ---------- */
.login { min-height: 100%; display: grid; place-items: center; padding-block: 32px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.login-card { width: 100%; max-width: 420px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 32px; display: grid; gap: 20px; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 16px; }
.brand-mark { width: 34px; height: 34px; border-radius: 9px; background: var(--brand); color: var(--on-brand); display: grid; place-items: center; }
.role-pick { display: grid; gap: 10px; }
.role-btn { display: flex; justify-content: space-between; align-items: center; gap: 12px; text-align: left; padding: 14px 16px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface-2); }
.role-btn:hover { border-color: var(--brand); background: var(--brand-soft); }
.role-btn small { display: block; color: var(--muted); font-size: 12px; }
.demo-note { font-size: 12px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 14px; }

/* ---------- khung ---------- */
.shell { display: flex; min-height: 100%; }
.side { width: 232px; flex-shrink: 0; background: var(--surface); border-right: 1px solid var(--line); display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; }
.side .brand { height: 64px; padding: 0 18px; }
.nav { flex: 1; padding: 6px 10px; display: grid; gap: 2px; align-content: start; overflow-y: auto; }
.nav a { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 8px; color: var(--muted); text-decoration: none; font-weight: 500; }
.nav a:hover { background: var(--surface-2); color: var(--fg); }
.nav a.on { background: var(--brand-soft); color: var(--brand-strong); }
.nav svg { width: 17px; height: 17px; flex-shrink: 0; }
.me { border-top: 1px solid var(--line); padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.me small { display: block; color: var(--muted); font-size: 12px; }
.main { flex: 1; min-width: 0; padding-block: 28px 48px; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); }
.topbar { display: none; }
.page-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 20px; }
.page-head h1 { font-size: 22px; font-weight: 650; }
.page-head p { margin: 2px 0 0; color: var(--muted); }
.banner { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; font-size: 12.5px; color: var(--muted); background: var(--surface); border: 1px dashed var(--line-strong); border-radius: var(--radius); padding: 8px 14px; margin-bottom: 20px; }

@media (max-width: 860px) {
  .shell { flex-direction: column; }
  .side { display: none; }
  .topbar { display: flex; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); gap: 6px; overflow-x: auto; padding-block: 8px; padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
  .topbar a { white-space: nowrap; padding: 6px 12px; border-radius: 999px; text-decoration: none; color: var(--muted); font-weight: 500; font-size: 13px; }
  .topbar a.on { background: var(--brand-soft); color: var(--brand-strong); }
  .main { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 18px 40px; }
}

/* ---------- thành phần ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); min-width: 0; }
.card-h { padding: 14px 18px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.card-h h3 { font-size: 15px; font-weight: 600; }
.card-b { padding: 16px 18px; }
.grid { display: grid; gap: 16px; }
.kpis { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.two { grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); }
@media (max-width: 1100px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } .two { grid-template-columns: minmax(0, 1fr); } }
.kpi { padding: 16px 18px; display: grid; gap: 4px; }
.kpi .l { color: var(--muted); font-size: 13px; }
.kpi .v { font-size: 24px; font-weight: 650; letter-spacing: -0.01em; }
.kpi .h { font-size: 12px; color: var(--muted); }
.up { color: var(--good); } .down { color: var(--bad); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 38px; padding: 0 16px; border-radius: 8px; border: 1px solid transparent; font-weight: 550; background: var(--brand); color: var(--on-brand); white-space: nowrap; }
.btn:hover { background: var(--brand-strong); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.sec { background: var(--surface); color: var(--fg); border-color: var(--line-strong); }
.btn.sec:hover { background: var(--surface-2); }
.btn.ghost { background: transparent; color: var(--muted); }
.btn.ghost:hover { background: var(--surface-2); color: var(--fg); }
.btn.sm { height: 30px; padding: 0 10px; font-size: 13px; }
.btn.lg { height: 48px; font-size: 15px; }
.input, .select { height: 38px; width: 100%; border: 1px solid var(--line-strong); border-radius: 8px; background: var(--surface); padding: 0 12px; }
.input:focus, .select:focus { outline: 2px solid var(--brand-soft); border-color: var(--brand); }
.field { display: grid; gap: 4px; font-size: 13px; }
.field > span { font-weight: 500; color: var(--muted); }
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-size: 11.5px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); padding: 10px 14px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 10px 14px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
td.r, th.r { text-align: right; }
td small { display: block; color: var(--muted); font-size: 12px; }
.pill { display: inline-flex; align-items: center; gap: 4px; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 550; white-space: nowrap; background: var(--surface-2); color: var(--muted); }
.pill.good { background: var(--good-soft); color: var(--good); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.brand { background: var(--brand-soft); color: var(--brand-strong); }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 16px; overflow-x: auto; }
.tabs button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 8px 14px; color: var(--muted); font-weight: 550; margin-bottom: -1px; white-space: nowrap; }
.tabs button.on { color: var(--brand-strong); border-color: var(--brand); }
.toolbar { display: flex; flex-wrap: wrap; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--line); }
.toolbar .input { max-width: 300px; }
.toolbar .select { max-width: 200px; }
.empty { padding: 32px; text-align: center; color: var(--muted); }
.list-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.list-row:last-child { border-bottom: 0; }
.toast { position: fixed; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 10px 18px; border-radius: 999px; font-weight: 550; z-index: 50; width: max-content; text-align: center; box-shadow: 0 8px 24px rgba(0,0,0,.18); max-width: calc(100% - 32px); }

/* ---------- POS ---------- */
.pos { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 16px; align-items: start; }
@media (max-width: 1100px) { .pos { grid-template-columns: minmax(0, 1fr); } .cart { order: -1; position: static; max-height: none; } }
.cats { display: flex; gap: 6px; flex-wrap: wrap; padding: 0 18px 14px; }
.chip { border: 1px solid var(--line-strong); background: var(--surface); border-radius: 999px; padding: 4px 12px; font-size: 13px; color: var(--muted); }
.chip.on { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); gap: 10px; padding: 0 18px 18px; }
.tile { text-align: left; border: 1px solid var(--line); background: var(--surface-2); border-radius: var(--radius); padding: 12px; display: grid; gap: 6px; min-height: 108px; align-content: space-between; }
.tile:hover { border-color: var(--brand); }
.tile:disabled { opacity: .45; }
.tile .n { font-weight: 550; font-size: 13px; line-height: 1.35; }
.tile { position: relative; }
.thumb { display: grid; place-items: center; border-radius: 8px; overflow: hidden; background: var(--thumb-bg, var(--surface)); flex: none; }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb .e { line-height: 1; }
.tile .thumb { width: 100%; aspect-ratio: 4 / 3; }
.tile .thumb .e { font-size: 40px; }
.tile .promo-tag { position: absolute; top: 8px; left: 8px; background: var(--bad); color: #fff; font-size: 11px; font-weight: 650; padding: 1px 6px; border-radius: 6px; }
.thumb.sm { width: 36px; height: 36px; } .thumb.sm .e { font-size: 20px; }
.thumb.lg { width: 96px; height: 96px; } .thumb.lg .e { font-size: 48px; }
.cat-0 { --thumb-bg: #e6f0ff; } .cat-1 { --thumb-bg: #fff1e0; } .cat-2 { --thumb-bg: #fdf6d8; } .cat-3 { --thumb-bg: #e9f8ef; } .cat-4 { --thumb-bg: #f1ecfd; } .cat-5 { --thumb-bg: #fdebf1; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .thumb { --thumb-bg: var(--surface-2); } }
:root[data-theme="dark"] .thumb { --thumb-bg: var(--surface-2); }
.search-bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.search-bar .input { flex: 1; min-width: 200px; }
.promo-line { color: var(--good); }
.voucher { display: flex; gap: 6px; }
.voucher .input { height: 30px; font-family: var(--font-mono); font-size: 12.5px; text-transform: uppercase; }
.tile .p { font-weight: 650; color: var(--brand-strong); }
.tile .s { font-size: 11.5px; color: var(--muted); }
.cart { position: sticky; top: 20px; display: flex; flex-direction: column; max-height: calc(100vh - 40px); }
.cart-items { overflow-y: auto; flex: 1; padding: 4px 18px; min-height: 120px; }
.ci { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.ci .n { font-weight: 550; font-size: 13px; }
.qty { display: inline-flex; align-items: center; border: 1px solid var(--line-strong); border-radius: 8px; overflow: hidden; }
.qty button { width: 28px; height: 28px; border: 0; background: var(--surface-2); }
.qty span { min-width: 30px; text-align: center; font-weight: 600; }
.sum { padding: 14px 18px; border-top: 1px solid var(--line); display: grid; gap: 6px; }
.sum .row { display: flex; justify-content: space-between; gap: 12px; }
.sum .total { font-size: 20px; font-weight: 700; }
.scan { display: flex; gap: 8px; padding: 14px 18px; }

/* ---------- hộp thoại ---------- */
.overlay { position: fixed; inset: 0; background: rgba(8, 12, 22, .55); display: grid; place-items: center; z-index: 40; padding-block: 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.dialog { background: var(--surface); border-radius: 14px; width: 100%; max-width: 460px; max-height: 100%; overflow-y: auto; border: 1px solid var(--line); }
.dialog .card-b { display: grid; gap: 14px; }
.methods { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.method { border: 1.5px solid var(--line-strong); background: var(--surface); border-radius: var(--radius); padding: 12px; font-weight: 600; }
.method.on { border-color: var(--brand); background: var(--brand-soft); color: var(--brand-strong); }
.quick { display: flex; flex-wrap: wrap; gap: 6px; }
.qr { display: grid; justify-items: center; gap: 8px; padding: 12px; border: 1px solid var(--line); border-radius: var(--radius); background: #ffffff; color: #0f172a; }
.qr svg { width: 220px; height: 220px; max-width: 100%; }
.qr .bank { font-size: 12px; text-align: center; color: #475569; }
.receipt { font-family: var(--font-mono); font-size: 12px; background: var(--surface-2); border: 1px dashed var(--line-strong); border-radius: 8px; padding: 14px; display: grid; gap: 4px; }
.receipt .row { display: flex; justify-content: space-between; gap: 8px; }
.receipt hr { border: 0; border-top: 1px dashed var(--line-strong); margin: 6px 0; width: 100%; }

/* ---------- biểu đồ ---------- */
.chart svg { width: 100%; height: auto; display: block; }
.chart text { fill: var(--muted); font-size: 11px; font-family: var(--font-ui); }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12.5px; color: var(--muted); }
.bar-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; padding: 7px 0; }
.bar-track { grid-column: 1 / -1; height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; }
.bar-fill { height: 100%; background: var(--brand); border-radius: 3px; }

/* ---------- phân quyền / kênh ---------- */
.matrix td, .matrix th { text-align: center; }
.matrix td:first-child, .matrix th:first-child { text-align: left; }
.matrix input { width: 17px; height: 17px; accent-color: var(--brand); }
.channels { grid-template-columns: repeat(3, minmax(0, 1fr)); }
@media (max-width: 1000px) { .channels { grid-template-columns: minmax(0, 1fr); } }
.seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 8px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: none; padding: 6px 12px; color: var(--muted); font-size: 13px; }
.seg button.on { background: var(--fg); color: var(--bg); font-weight: 600; }
.stat3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; background: var(--surface-2); border-radius: 8px; padding: 10px; text-align: center; }
.stat3 small { display: block; color: var(--muted); font-size: 11.5px; }
.stat3 b { font-size: 15px; }
.flow { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
@media (max-width: 900px) { .flow { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 520px) { .flow { grid-template-columns: minmax(0, 1fr); } }
.flow-step { display: flex; gap: 10px; }
.flow-step .n { flex: none; width: 26px; height: 26px; border-radius: 50%; background: var(--brand-soft); color: var(--brand-strong); font-weight: 650; font-size: 13px; display: grid; place-items: center; }
.flow-step b { display: block; }
.flow-step span { color: var(--muted); font-size: 13px; }
.code-box { background: #0f172a; color: #e2e8f0; border-radius: 8px; padding: 12px; font-family: var(--font-mono); font-size: 11.5px; line-height: 1.55; max-height: 260px; overflow: auto; white-space: pre; margin: 0; }
.dialog.wide { max-width: 640px; }
.sku-input { height: 30px; width: 150px; font-family: var(--font-mono); font-size: 12px; }
.ch-logo { width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 13px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

function ymd(d) { return d.getFullYear() + String(d.getMonth() + 1).padStart(2, "0") + String(d.getDate()).padStart(2, "0"); }

function nextCode(offset = 1) {

  const last = S.orders.filter((o) => o.code.startsWith(prefix)).reduce((m, o) => Math.max(m, Number(o.code.slice(prefix.length))), 0);

}
function randomHex(bytes, r = Math.random) { return Array.from({ length: bytes }, () => Math.floor(r() * 256).toString(16).padStart(2, "0")).join(""); }

// ===================== VietQR (chuẩn EMVCo của NAPAS) =====================
function tlv(id, value) { return id + String(value.length).padStart(2, "0") + value; }
function crc16(s) {
  let crc = 0xffff;
  for (let i = 0; i < s.length; i++) {
    crc ^= s.charCodeAt(i) << 8;
    for (let j = 0; j < 8; j++) crc = crc & 0x8000 ? ((crc << 1) ^ 0x1021) & 0xffff : (crc << 1) & 0xffff;
  }
  return crc.toString(16).toUpperCase().padStart(4, "0");
}
function vietQrPayload(amount, note) {
  const account = tlv("00", "A000000727") + tlv("01", tlv("00", store().bankBin) + tlv("01", store().account)) + tlv("02", "QRIBFTTA");
  const body = tlv("00", "01") + tlv("01", "12") + tlv("38", account) + tlv("53", "704") + tlv("54", String(amount)) + tlv("58", "VN") + tlv("62", tlv("08", note)) + "6304";
  return body + crc16(body);
}
function qrSvg(text) {
  try {
    const qr = qrcode(0, "M"); qr.addData(text); qr.make();
    return qr.createSvgTag(5, 8);
  } catch { return `<div class="mono" style="word-break:break-all;max-width:240px">${esc(text)}</div>`; }
}

const PROMO_TYPE = { PERCENT_ITEM: "Giảm % sản phẩm", BUY_X_GET_1: "Mua X tặng 1", PERCENT_ORDER: "Giảm % đơn hàng", FIXED_ORDER: "Giảm tiền trên đơn" };
function round1k(n) { return Math.round(n / 1000) * 1000; }
function promoStatus(k, at = Date.now()) {
  if (!k.active) return ["Tạm dừng", ""];
  if (at < k.from) return ["Sắp diễn ra", "warn"];
  if (at >= k.to + 86400000) return ["Đã kết thúc", ""];
  return ["Đang chạy", "good"];
}
const promoLive = (k) => promoStatus(k)[0] === "Đang chạy";
const promoHits = (k, p) => k.scope === "all" || (k.scope === "cat" && p.cat === k.target) || (k.scope === "product" && p.id === k.target);
function promoOrderAmount(k, base) {
  const raw = k.type === "FIXED_ORDER" ? k.value : round1k((base * k.value) / 100);
  return Math.min(base, k.max ? Math.min(raw, k.max) : raw);
}
function promoLabel(k) {
  const scope = k.scope === "cat" ? ` nhóm ${k.target}` : k.scope === "product" ? ` ${prod(k.target)?.name ?? ""}` : "";
  if (k.type === "PERCENT_ITEM") return `Giảm ${k.value}%${scope}`;
  if (k.type === "BUY_X_GET_1") return `Mua ${k.value} tặng 1${scope}`;
  const cond = (k.min ? ` cho đơn từ ${short(k.min)}` : "") + (k.max ? `, tối đa ${short(k.max)}` : "");
  return (k.type === "FIXED_ORDER" ? `Giảm ${short(k.value)}` : `Giảm ${k.value}%`) + " trên đơn" + cond;
}
// Tính tiền giỏ hàng: mỗi dòng lấy khuyến mãi sản phẩm có lợi nhất, rồi cả đơn lấy một khuyến mãi theo đơn có lợi nhất
// (gồm cả mã giảm giá khách nhập), cuối cùng mới tới giảm giá tay của quản lý.
function itemPromo(p, qty) {
  let best = null;
  for (const k of S.promos) {
    if (!promoLive(k) || k.code || !promoHits(k, p)) continue;
    const amount = k.type === "PERCENT_ITEM" ? round1k((p.price * qty * k.value) / 100) : k.type === "BUY_X_GET_1" ? Math.floor(qty / (k.value + 1)) * p.price : 0;
    if (amount > 0 && (!best || amount > best.amount)) best = { id: k.id, name: k.name, amount };
  }
  return best;
}
function cartTotals() {
  const lines = ui.cart.map((x) => { const p = prod(x.pid); return { p, qty: x.qty, base: p.price * x.qty, promo: itemPromo(p, x.qty) }; });
  const subtotal = lines.reduce((s, l) => s + l.base, 0);
  const applied = lines.filter((l) => l.promo).map((l) => l.promo);
  const afterItems = subtotal - applied.reduce((s, a) => s + a.amount, 0);
  const code = ui.voucher.trim().toUpperCase();
  let orderBest = null, voucherError = "";
  for (const k of S.promos) {
    if (k.type !== "PERCENT_ORDER" && k.type !== "FIXED_ORDER") continue;
    if (k.code && k.code !== code) continue;
    if (!promoLive(k) || afterItems < k.min) continue;
    const amount = promoOrderAmount(k, afterItems);
    if (!orderBest || amount > orderBest.amount) orderBest = { id: k.id, name: k.name, amount };
  }
  if (code) {
    const v = S.promos.find((k) => k.code === code);
    if (!v) voucherError = "Mã không tồn tại";
    else if (!promoLive(v)) voucherError = `Mã ${promoStatus(v)[0].toLowerCase()}`;
    else if (afterItems < v.min) voucherError = `Cần đơn từ ${money(v.min)}`;
    else if (orderBest?.id !== v.id) voucherError = "Đơn đang hưởng khuyến mãi tốt hơn";
  }
  if (orderBest) applied.push(orderBest);
  const afterPromo = subtotal - applied.reduce((s, a) => s + a.amount, 0);
  const manual = round1k((afterPromo * ui.discountPct) / 100);
  const discount = subtotal - afterPromo + manual;
  return { lines, subtotal, applied, manual, discount, total: subtotal - discount, voucherError, code };
}
function addToCart(pid) {
  const p = prod(pid);
  const line = ui.cart.find((x) => x.pid === pid);
  const inCart = line ? line.qty : 0;
  if (inCart + 1 > p.qty) return toast(`Không đủ hàng: ${p.name} chỉ còn ${p.qty}`);
  if (line) line.qty++; else ui.cart.push({ pid, qty: 1 });
  render();
}
function checkout(method, cashGiven) {
  const { subtotal, discount, total, applied, manual } = cartTotals();
  for (const x of ui.cart) if (x.qty > prod(x.pid).qty) return toast(`Không đủ hàng: ${prod(x.pid).name}`);
  const order = {

// Mỗi sàn gửi payload một kiểu; bản demo dựng đúng kiểu đó, ký HMAC-SHA256 bằng secret của kênh,
// rồi kiểm chữ ký và đổi SKU về sản phẩm như webhook ở máy chủ.
const PLATFORM = {
  SHOPEE: { header: "x-shopee-signature", prefix: "SHP", payload: (o) => ({ ordersn: o.external, order_status: "READY_TO_SHIP", create_time: Math.floor(o.at / 1000), buyer_username: o.buyer, recipient_address: { phone: o.phone }, item_list: o.lines.map((l) => ({ model_sku: l.sku, model_quantity_purchased: l.qty, model_discounted_price: l.price })), total_amount: o.total }) },
  TIKTOK: { header: "x-tts-signature", prefix: "TTS", payload: (o) => ({ type: "ORDER_STATUS_CHANGE", data: { order_id: o.external, order_status: "AWAITING_SHIPMENT", create_time: Math.floor(o.at / 1000), recipient_address: { name: o.buyer, phone_number: o.phone }, line_items: o.lines.map((l) => ({ seller_sku: l.sku, quantity: l.qty, sale_price: l.price })), payment: { currency: "VND", total_amount: o.total } } }) },
  LAZADA: { header: "x-lazada-signature", prefix: "LZD", payload: (o) => ({ order_number: o.external, statuses: ["pending"], created_at: new Date(o.at).toISOString(), customer_first_name: o.buyer, address_shipping: { phone: o.phone }, items: o.lines.map((l) => ({ sku: l.sku, quantity: l.qty, paid_price: l.price })), price: o.total }) },
};
const BUYERS = [["Nguyễn Thu Hà", "0912345678"], ["Trần Quốc Bảo", "0987654321"], ["Lê Ngọc Mai", "0903112233"], ["Phạm Gia Huy", "0938456789"], ["Võ Thanh Tâm", "0977001122"]];
async function hmacHex(body, secret) {
  try {
    const key = await crypto.subtle.importKey("raw", new TextEncoder().encode(secret), { name: "HMAC", hash: "SHA-256" }, false, ["sign"]);
    const sig = await crypto.subtle.sign("HMAC", key, new TextEncoder().encode(body));
    return [...new Uint8Array(sig)].map((b) => b.toString(16).padStart(2, "0")).join("");
  } catch { return randomHex(32); }
}
async function simulateOnlineOrder(ch) {
  const c = S.channels[ch];
  if (!c.connected) return toast("Hãy kết nối kênh trước khi tạo đơn thử");
  const pool = S.products.filter((p) => p.active && p.qty > 3 && c.map[p.id]);
  if (!pool.length) return toast(`${CHANNEL_INFO[ch].name} chưa có sản phẩm nào được liên kết và còn hàng`);
  const r = Math.random;
  const picked = [];
  for (let k = 0, n = Math.min(pool.length, 1 + Math.floor(r() * 3)); picked.length < n && k < 20; k++) {
    const p = pool[Math.floor(r() * pool.length)];
    if (!picked.includes(p)) picked.push(p);
  }
  const lines = picked.map((p) => ({ sku: c.map[p.id], qty: 1 + Math.floor(r() * 2), price: p.price }));
  const subtotal = lines.reduce((s, l) => s + l.qty * l.price, 0);
  const voucher = subtotal >= 100000 && r() < 0.33 ? 10000 : 0;
  const [buyer, phone] = BUYERS[Math.floor(r() * BUYERS.length)];
  const ext = { external: PLATFORM[ch].prefix + Date.now(), at: Date.now(), buyer, phone, lines, total: subtotal - voucher };
  const body = JSON.stringify(PLATFORM[ch].payload(ext), null, 2);
  const signature = await hmacHex(body, c.secret);

  // Phía nhận: kiểm chữ ký, bỏ qua đơn trùng, đổi SKU sàn về sản phẩm
  if (signature !== await hmacHex(body, c.secret)) return toast("Sai chữ ký webhook");
  if (S.orders.some((o) => o.source === ch && o.external === ext.external)) return toast("Đơn đã nhận trước đó");
  const bySku = Object.fromEntries(Object.entries(c.map).map(([pid, sku]) => [sku, pid]));
  const items = lines.map((l) => { const p = prod(bySku[l.sku]); return { pid: p.id, name: p.name, qty: l.qty, price: l.price, cost: p.cost }; });
  const order = { code: nextCode(), source: ch, items, subtotal, discount: voucher, total: ext.total, method: "CHANNEL", status: "PAID", at: ext.at, staff: null, external: ext.external, buyer };
  for (const it of items) moveStock(it.pid, -it.qty, "ONLINE_SALE", order.code);
  S.orders.push(order);
  save();
  render();
  modal(`<div class="dialog wide" role="dialog" aria-modal="true" aria-label="Đơn thử đã đổ về">
    <div class="card-h"><h3>Đơn ${CHANNEL_INFO[ch].name} đã đổ về</h3><button class="btn ghost sm" data-act="close">Đóng</button></div>
    <div class="card-b">
      <p style="margin:0;color:var(--muted);font-size:13px">Sàn gửi webhook dưới đây, có chữ ký HMAC-SHA256 theo secret của kênh. Hệ thống kiểm chữ ký, ghép SKU với sản phẩm, rồi tạo đơn <b style="color:var(--fg)">${order.code}</b> (${money(order.total)}) và trừ tồn kho.</p>
      <div class="mono" style="font-size:11.5px;color:var(--muted);word-break:break-all">POST /api/channels/${ch.toLowerCase()}/webhook<br>${PLATFORM[ch].header}: ${signature}</div>
      <pre class="code-box">${esc(body)}</pre>
      <div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn sec" data-act="close">Đóng</button><button class="btn" data-act="order" data-code="${order.code}">Xem đơn</button></div>
    </div></div>`);
}

function dailySeries(days, filter = () => true) {
  const out = [];
  const today = startOfDay(Date.now());
  for (let i = days - 1; i >= 0; i--) {
    const from = today - i * 86400000, to = from + 86400000;
    const list = paid().filter((o) => o.at >= from && o.at < to && filter(o));
    out.push({ day: from, revenue: list.reduce((s, o) => s + o.total, 0), orders: list.length, pos: list.filter((o) => o.source === "POS").reduce((s, o) => s + o.total, 0) });
  }
  return out;
}
function barChart(series, { height = 220, stacked = false } = {}) {
  const W = 720, H = height, L = 48, B = 26, T = 12;
  const max = Math.max(...series.map((s) => s.revenue), 1);
  const step = niceStep(max / 4);
  const top = Math.ceil(max / step) * step;
  const bw = (W - L - 8) / series.length;
  const y = (v) => T + (H - T - B) * (1 - v / top);
  let g = "";
  for (let v = 0; v <= top; v += step) g += `<line x1="${L}" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L - 8}" y="${y(v) + 4}" text-anchor="end">${short(v)}</text>`;
  series.forEach((s, i) => {
    const x = L + i * bw + bw * 0.18, w = bw * 0.64;
    const last = i === series.length - 1;
    if (stacked) {
      g += `<rect x="${x}" y="${y(s.revenue)}" width="${w}" height="${y(0) - y(s.revenue)}" rx="2" fill="var(--warn)" opacity=".85"><title>Online ${money(s.revenue - s.pos)}</title></rect>`;
      g += `<rect x="${x}" y="${y(s.pos)}" width="${w}" height="${y(0) - y(s.pos)}" rx="2" fill="var(--brand)"><title>Tại quầy ${money(s.pos)}</title></rect>`;
    } else {
      g += `<rect x="${x}" y="${y(s.revenue)}" width="${w}" height="${y(0) - y(s.revenue)}" rx="3" fill="var(--brand)" opacity="${last ? 1 : 0.55}"><title>${new Date(s.day).toLocaleDateString("vi-VN")}: ${money(s.revenue)}</title></rect>`;
    }
    const every = series.length > 16 ? Math.ceil(series.length / 8) : 1;
    if ((i % every === 0 && series.length - 1 - i >= Math.ceil(every / 2)) || last) {
      const d = new Date(s.day);
      g += `<text x="${x + w / 2}" y="${H - 8}" text-anchor="middle" ${last ? 'font-weight="600" style="fill:var(--fg)"' : ""}>${d.getDate()}/${d.getMonth() + 1}</text>`;
    }
  });
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Biểu đồ doanh thu theo ngày">${g}</svg></div>`;
}
const LEGEND = `<div class="legend"><span><span class="dot" style="background:var(--brand)"></span> Tại quầy</span><span><span class="dot" style="background:var(--warn)"></span> Online</span></div>`;
function progressRows(rows, total) {
  const max = Math.max(...rows.map((x) => x.value), 1);
  return rows.map((x) => `<div class="bar-row"><span>${x.label}${x.sub ? ` <span style="color:var(--muted)">· ${x.sub}</span>` : ""}</span><b class="num">${money(x.value)}${total ? ` <span style="color:var(--muted);font-weight:500">(${Math.round((x.value / total) * 100)}%)</span>` : ""}</b><div class="bar-track"><div class="bar-fill" style="width:${(x.value / max) * 100}%"></div></div></div>`).join("");
}
function niceStep(raw) {
  const p = Math.pow(10, Math.floor(Math.log10(raw)));
  for (const m of [1, 2, 2.5, 5, 10]) if (raw <= m * p) return m * p;
  return 10 * p;
}
function topProducts(orders, n = 5) {
  const map = new Map();
  for (const o of orders) for (const it of o.items) {
    const e = map.get(it.pid) ?? { name: it.name, qty: 0, revenue: 0 };
    e.qty += it.qty; e.revenue += it.qty * it.price; map.set(it.pid, e);
  }
  return [...map.values()].sort((a, b) => b.revenue - a.revenue).slice(0, n);
}

function openProduct(id) {
  const p = id ? prod(id) : { name: "", sku: "SP" + String(S.products.length + 1).padStart(4, "0"), barcode: "", cat: "Đồ uống", unit: "cái", price: "", cost: "", qty: 0, threshold: 10 };

          <span style="display:flex;gap:6px"><label class="btn sec sm" style="display:inline-flex;align-items:center">Tải ảnh lên<input id="f-image" type="file" accept="image/*" hidden></label>${p.image ? '<button type="button" class="btn ghost sm" data-act="clear-image">Dùng ảnh minh họa</button>' : ""}</span></div></div>

      <div class="methods"><label class="field"><span>Danh mục</span><select id="f-cat" class="select">${Object.keys(CATALOG).map((c) => `<option ${c === p.cat ? "selected" : ""}>${c}</option>`).join("")}</select></label><label class="field"><span>Đơn vị</span><input id="f-unit" class="input" value="${esc(p.unit)}"></label></div>
      <div class="methods"><label class="field"><span>Giá bán (đ)</span><input id="f-price" class="input num" inputmode="numeric" required value="${p.price}"></label><label class="field"><span>Giá vốn (đ)</span><input id="f-cost" class="input num" inputmode="numeric" value="${p.cost}"></label></div>
      ${id ? "" : `<label class="field"><span>Tồn đầu kỳ</span><input id="f-qty" class="input num" inputmode="numeric" value="0"></label>`}
      <p id="f-err" class="down" style="margin:0" hidden></p>
      <button class="btn lg" type="submit">${id ? "Lưu thay đổi" : "Thêm sản phẩm"}</button>
    </div></form></div>`);
  ui.draftImage = undefined; ui.editing = p;
  document.getElementById("f-image").addEventListener("change", async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    try {
      const bmp = await createImageBitmap(file);
      const size = 240, c = document.createElement("canvas"); c.width = c.height = size;
      const k = Math.max(size / bmp.width, size / bmp.height);
      c.getContext("2d").drawImage(bmp, (size - bmp.width * k) / 2, (size - bmp.height * k) / 2, bmp.width * k, bmp.height * k);
      ui.draftImage = c.toDataURL("image/jpeg", 0.8);
      document.getElementById("f-thumb").innerHTML = thumb({ ...p, image: ui.draftImage }, "lg");
    } catch { toast("Không đọc được ảnh này"); }
  });
  document.getElementById("pform").addEventListener("submit", (e) => {
    e.preventDefault();
    const v = (k) => document.getElementById("f-" + k).value.trim();
    const err = (m) => { const el = document.getElementById("f-err"); el.textContent = m; el.hidden = false; };
    const sku = v("sku").toUpperCase(), price = Number(v("price").replace(/\D/g, "")), cost = Number(v("cost").replace(/\D/g, "")) || 0;
    if (!v("name")) return err("Vui lòng nhập tên sản phẩm");
    if (!price) return err("Giá bán phải lớn hơn 0");
    if (S.products.some((x) => x.sku === sku && x.id !== id)) return err(`Mã SKU ${sku} đã tồn tại`);
    const data = { name: v("name"), sku, barcode: v("barcode"), cat: v("cat"), unit: v("unit") || "cái", price, cost };
    if (ui.draftImage !== undefined) data.image = ui.draftImage;
    if (id) Object.assign(prod(id), data);
    else {
      const np = { id: "p" + Date.now(), ...data, qty: 0, threshold: 10, active: true };
      S.products.push(np);
      const q0 = Number(v("qty")) || 0;
      if (q0 > 0) moveStock(np.id, q0, "RECEIPT", "Tồn đầu kỳ");
    }
    save(); closeModal(); toast(id ? "Đã lưu sản phẩm" : `Đã thêm ${data.name}`); render();
  });
}

        ? `<div class="methods"><label class="field"><span>Số lượng nhập</span><input id="s-qty" class="input num" inputmode="numeric" value="24" required></label><label class="field"><span>Giá nhập (đ)</span><input id="s-cost" class="input num" inputmode="numeric" value="${p.cost}"></label></div><label class="field"><span>Nhà cung cấp</span><input id="s-sup" class="input" value="NPP Hòa Phát"></label>`
        : `<label class="field"><span>Số đếm thực tế</span><input id="s-qty" class="input num" inputmode="numeric" value="${p.qty}" required></label><p style="margin:0;color:var(--muted);font-size:13px">Chênh lệch sẽ ghi vào sổ biến động kho dưới dạng kiểm kê.</p>`}
      <button class="btn lg" type="submit">${mode === "receive" ? "Nhập kho" : "Lưu kiểm kê"}</button></div></form></div>`);
  document.getElementById("sform").addEventListener("submit", (e) => {
    e.preventDefault();
    const n = Number(document.getElementById("s-qty").value.replace(/\D/g, ""));
    if (mode === "receive") {
      if (!n) return;
      const cost = Number(document.getElementById("s-cost").value.replace(/\D/g, "")) || p.cost;
      const code = "PN" + ymd(new Date()) + "-" + String(S.movements.filter((m) => m.type === "RECEIPT").length + 1).padStart(3, "0");
      p.cost = cost; moveStock(id, n, "RECEIPT", code); toast(`Đã nhập ${n} ${p.unit}, phiếu ${code}`);
    } else {
      const delta = n - p.qty;
      if (delta) moveStock(id, delta, "ADJUSTMENT", "Kiểm kê");
      toast(delta ? `Đã điều chỉnh ${delta > 0 ? "+" : ""}${delta}` : "Không có chênh lệch");
    }
    save(); closeModal(); render();
  });
}

function reportsView() {
  const own = !can("report.view");
  const filter = own ? (o) => o.staff === me().name : () => true;
  const days = ui.days;
  const since = startOfDay(Date.now()) - (days - 1) * 86400000;
  const list = paid().filter((o) => o.at >= since && filter(o));
  const revenue = list.reduce((s, o) => s + o.total, 0);
  const discount = list.reduce((s, o) => s + o.discount, 0);
  const cogs = list.reduce((s, o) => s + o.items.reduce((a, it) => a + it.qty * it.cost, 0), 0);
  const profit = revenue - cogs;
  const group = (key) => Object.values(list.reduce((m, o) => { const k = key(o); if (k == null) return m; (m[k] ??= { k, value: 0, count: 0 }); m[k].value += o.total; m[k].count++; return m; }, {})).sort((a, b) => b.value - a.value);
  const bySource = group((o) => o.source);
  const byMethod = group((o) => o.method);
  const byStaff = group((o) => o.staff);
  const prodMap = new Map();
  for (const o of list) for (const it of o.items) {
    const e = prodMap.get(it.pid) ?? { name: it.name, unit: prod(it.pid)?.unit ?? "", qty: 0, value: 0, profit: 0 };
    e.qty += it.qty; e.value += it.qty * it.price; e.profit += it.qty * (it.price - it.cost); prodMap.set(it.pid, e);
  }
  const top = [...prodMap.values()].sort((a, b) => b.value - a.value).slice(0, 10);
  const seg = `<div class="seg" role="group" aria-label="Khoảng thời gian">${[7, 30, 90].map((d) => `<button class="${d === days ? "on" : ""}" data-act="days" data-d="${d}">${d} ngày</button>`).join("")}</div>`;
  return head("Báo cáo doanh thu", own ? `Doanh thu các đơn ${esc(me().name)} bán, ${days} ngày gần nhất` : `${days} ngày gần nhất, chỉ tính đơn đã thanh toán`, seg) + `
  <div class="grid kpis">
    <div class="card kpi"><span class="l">Doanh thu</span><span class="v num">${money(revenue)}</span><span class="h">${list.length} đơn đã thanh toán</span></div>
    ${own ? `<div class="card kpi"><span class="l">Số đơn</span><span class="v num">${list.length}</span><span class="h">Không hiện lợi nhuận với vai trò thu ngân</span></div>`
      : `<div class="card kpi"><span class="l">Lợi nhuận gộp</span><span class="v num">${money(profit)}</span><span class="h">Biên ${revenue ? Math.round((profit / revenue) * 100) : 0}%, theo giá vốn lúc bán</span></div>`}
    <div class="card kpi"><span class="l">Giá trị đơn trung bình</span><span class="v num">${money(list.length ? Math.round(revenue / list.length) : 0)}</span><span class="h">&nbsp;</span></div>
    <div class="card kpi"><span class="l">Trung bình mỗi ngày</span><span class="v num">${money(Math.round(revenue / days))}</span><span class="h">Đã giảm giá ${money(discount)}</span></div>
  </div>
  <div class="card" style="margin-top:16px"><div class="card-h"><h3>Doanh thu theo ngày</h3>${LEGEND}</div>
    <div class="card-b">${barChart(dailySeries(days, filter), { stacked: true })}</div></div>
  <div class="grid two" style="margin-top:16px">
    <div class="card"><div class="card-h"><h3>Top sản phẩm</h3></div><div class="card-b">${top.length ? progressRows(top.map((t) => ({ label: esc(t.name), sub: `${t.qty} ${t.unit}${own ? "" : ` · lãi ${vnd.format(t.profit)} ₫`}`, value: t.value }))) : '<div class="empty">Chưa có dữ liệu</div>'}</div></div>
    <div style="display:grid;gap:16px;align-content:start">
      <div class="card"><div class="card-h"><h3>Theo kênh bán</h3></div><div class="card-b">${progressRows(bySource.map((x) => ({ label: SOURCE_LABEL[x.k], sub: `${x.count} đơn`, value: x.value })), revenue) || '<div class="empty">Chưa có dữ liệu</div>'}</div></div>
      <div class="card"><div class="card-h"><h3>Theo hình thức thanh toán</h3></div><div class="table-wrap"><table><thead><tr><th>Hình thức</th><th class="r">Số giao dịch</th><th class="r">Số tiền</th></tr></thead><tbody>
        ${byMethod.map((x) => `<tr><td>${METHOD_LABEL[x.k]}</td><td class="r num">${x.count}</td><td class="r num">${money(x.value)}</td></tr>`).join("")}</tbody></table></div></div>
      ${own ? "" : `<div class="card"><div class="card-h"><h3>Theo nhân viên bán tại quầy</h3></div><div class="table-wrap"><table><thead><tr><th>Nhân viên</th><th class="r">Số đơn</th><th class="r">Doanh thu</th></tr></thead><tbody>
        ${byStaff.map((x) => `<tr><td>${esc(x.k)}</td><td class="r num">${x.count}</td><td class="r num">${money(x.value)}</td></tr>`).join("")}</tbody></table></div></div>`}
    </div>
  </div>`;
}

      <div class="methods"><label class="field"><span>Từ ngày</span><input id="k-from" type="date" class="input" value="${iso(k.from)}"></label><label class="field"><span>Đến hết ngày</span><input id="k-to" type="date" class="input" value="${iso(k.to)}"></label></div>
      <p id="k-err" class="down" style="margin:0" hidden></p>
      <button class="btn lg" type="submit">${id ? "Lưu thay đổi" : "Tạo khuyến mãi"}</button>
    </div></form></div>`);
  const $ = (x) => document.getElementById("k-" + x);
  const sync = () => {
    const type = $("type").value, item = type === "PERCENT_ITEM" || type === "BUY_X_GET_1";
    document.querySelectorAll(".k-item").forEach((el) => (el.style.display = item ? "" : "none"));
    document.querySelectorAll(".k-order").forEach((el) => (el.style.display = item ? "none" : ""));
    document.querySelector(".k-pct").style.visibility = type === "PERCENT_ORDER" ? "" : "hidden";
    $("value-l").textContent = { PERCENT_ITEM: "Giảm (%)", BUY_X_GET_1: "Mua bao nhiêu thì tặng 1", PERCENT_ORDER: "Giảm (%)", FIXED_ORDER: "Giảm (đ)" }[type];
    if (type === "BUY_X_GET_1" && $("scope").value !== "product") $("scope").value = "product";
    const scope = $("scope").value, cur = $("target").value || k.target;
    $("target").disabled = scope === "all";
    $("target").innerHTML = scope === "cat" ? CATS().map((c) => `<option ${c === cur ? "selected" : ""}>${c}</option>`).join("") : scope === "product" ? S.products.filter((p) => p.active).map((p) => `<option value="${p.id}" ${p.id === cur ? "selected" : ""}>${esc(p.name)}</option>`).join("") : "<option>Mọi sản phẩm</option>";
  };
  $("type").addEventListener("change", sync); $("scope").addEventListener("change", () => { $("target").value = ""; sync(); });
  sync();
  document.getElementById("kform").addEventListener("submit", (e) => {
    e.preventDefault();
    const err = (m) => { $("err").textContent = m; $("err").hidden = false; };
    const num = (x) => Number($(x).value.replace(/\D/g, "")) || 0;
    const type = $("type").value, item = type === "PERCENT_ITEM" || type === "BUY_X_GET_1";
    const value = num("value"), code = item ? "" : $("code").value.trim().toUpperCase().replace(/\s/g, "");
    const from = new Date($("from").value + "T00:00").getTime(), to = new Date($("to").value + "T00:00").getTime();
    if (!$("name").value.trim()) return err("Vui lòng nhập tên chương trình");
    if (!value) return err("Giá trị phải lớn hơn 0");
    if ((type === "PERCENT_ITEM" || type === "PERCENT_ORDER") && value > 90) return err("Giảm tối đa 90%");
    if (!(from <= to)) return err("Ngày kết thúc phải sau ngày bắt đầu");
    if (code && S.promos.some((x) => x.code === code && x.id !== id)) return err(`Mã ${code} đã được dùng`);
    const data = { name: $("name").value.trim(), type, value, scope: item ? $("scope").value : "all", target: item && $("scope").value !== "all" ? $("target").value : "", min: item ? 0 : num("min"), max: type === "PERCENT_ORDER" ? num("max") : 0, code, from, to };
    if (id) Object.assign(k, data); else S.promos.push({ id: "km" + Date.now(), ...data, active: true });
    save(); closeModal(); toast(id ? "Đã lưu khuyến mãi" : `Đã tạo ${data.name}`); render();
  });
}

// ===================== Cài đặt =====================

  const st = store();
  const ready = st.bankBin && st.account;
  return head("Cài đặt cửa hàng", "Thông tin in trên hóa đơn và tài khoản nhận tiền VietQR") + `
  <div class="grid two">

      <form class="card-b" id="store-form" style="display:grid;gap:14px">
        <label class="field"><span>Tên cửa hàng</span><input class="input" name="name" required value="${esc(st.name)}"></label>
        <label class="field"><span>Địa chỉ</span><input class="input" name="address" value="${esc(st.address)}"></label>
        <label class="field"><span>Số điện thoại</span><input class="input" name="phone" value="${esc(st.phone ?? "")}"></label>
        <div style="border-top:1px solid var(--line);padding-top:14px"><b>Tài khoản nhận tiền VietQR</b><p style="margin:2px 0 0;color:var(--muted);font-size:13px">Mã QR ở quầy chuyển tiền thẳng vào tài khoản này, kèm sẵn số tiền và mã đơn.</p></div>
        <label class="field"><span>Ngân hàng</span><select class="select" name="bankBin"><option value="">Chưa chọn</option>${BANKS.map(([b, n]) => `<option value="${b}" ${b === st.bankBin ? "selected" : ""}>${n}</option>`).join("")}</select></label>
        <label class="field"><span>Số tài khoản</span><input class="input" name="account" inputmode="numeric" value="${esc(st.account)}"></label>
        <label class="field"><span>Tên chủ tài khoản</span><input class="input" name="holder" value="${esc(st.holder)}"><small style="color:var(--faint);font-size:12px">Tự đổi sang in hoa không dấu như trên app ngân hàng</small></label>
        <div style="display:flex;gap:10px;align-items:center"><button class="btn" data-act="save-store">Lưu cài đặt</button><span id="store-msg" style="font-size:13px;color:var(--bad)"></span></div>
      </form></div>
    <div style="display:grid;gap:16px;align-content:start">
      <div class="card"><div class="card-h"><h3>Mã QR mẫu ở quầy</h3><span class="pill ${ready ? "good" : "warn"}">${ready ? "Sẵn sàng" : "Chưa cấu hình"}</span></div><div class="card-b">
        ${ready ? `<div class="qr">${qrSvg(vietQrPayload(10000, "DEMO"))}<div class="bank"><b>${bankName(st.bankBin)}</b> · ${esc(st.account)}<br>${esc(st.holder)}<br>Đơn mẫu 10.000 ₫, nội dung <b>DEMO</b></div></div>` : '<div class="empty">Chọn ngân hàng và nhập số tài khoản để bật thanh toán VietQR</div>'}
      </div></div>
      <div class="card"><div class="card-h"><h3>Đầu hóa đơn</h3></div><div class="card-b"><div class="receipt" style="margin:0 auto">
        <b style="text-align:center">${esc(st.name.toUpperCase())}</b><span style="text-align:center">${esc(st.address)}</span>${st.phone ? `<span style="text-align:center">ĐT: ${esc(st.phone)}</span>` : ""}<hr><span style="text-align:center">HÓA ĐƠN BÁN HÀNG</span>
      </div></div></div>
    </div>
  </div>`;
}
function saveStore() {
  const f = new FormData(document.getElementById("store-form"));
  const v = (k) => String(f.get(k) ?? "").trim();
  const msg = (t) => { document.getElementById("store-msg").textContent = t; };
  const account = v("account").replace(/\s/g, "");
  if (!v("name")) return msg("Vui lòng nhập tên cửa hàng");
  if (account && !/^\d{6,19}$/.test(account)) return msg("Số tài khoản chỉ gồm 6 đến 19 chữ số");
  S.store = { name: v("name"), address: v("address"), phone: v("phone"), bankBin: v("bankBin"), account,
    holder: v("holder").normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/đ/gi, "D").toUpperCase() };
  save(); toast("Đã lưu cài đặt cửa hàng"); render();
}

const VIEWS = { dashboard: dashboardView, pos: posView, orders: ordersView, products: productsView, inventory: inventoryView, reports: reportsView, staff: staffView, channels: channelsView, settings: settingsView, promos: promosView };

// ===================== Hộp thoại =====================
function modal(html) { document.getElementById("modal").innerHTML = `<div class="overlay" data-act="overlay">${html}</div>`; }
function closeModal() { document.getElementById("modal").innerHTML = ""; }

// ===================== Sự kiện =====================
document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-act]");
  if (!t) return;
  const a = t.dataset.act;
  if (a === "overlay") { if (e.target === t) closeModal(); return; }
  if (t.tagName === "A" || t.tagName === "BUTTON") e.preventDefault();
  switch (a) {
    case "login": S.user = t.dataset.id; ui.cart = []; save(); location.hash = ""; render(); break;
    case "logout": S.user = null; save(); closeModal(); render(); break;
    case "reset": { const u = S.user; S = seedState(); S.user = u; ui.cart = []; save(); toast("Đã khôi phục dữ liệu mẫu"); render(); break; }
    case "cat": ui.cat = t.dataset.cat; render(); break;
    case "add": addToCart(t.dataset.id); break;
    case "dec": { const l = ui.cart.find((x) => x.pid === t.dataset.id); l.qty--; if (!l.qty) ui.cart = ui.cart.filter((x) => x !== l); render(); break; }
    case "clear": ui.cart = []; ui.discountPct = 0; render(); break;
    case "demo-scan": { const pool = S.products.filter((p) => p.qty > 0); const p = pool[Math.floor(Math.random() * pool.length)]; toast(`Quét ${p.barcode}: ${p.name}`); addToCart(p.id); break; }
    case "pay": openPay(); break;
    case "method": ui.payMethod = t.dataset.m; openPay(); break;
    case "cash": ui.cashGiven = t.dataset.v; openPay(); break;
    case "confirm-pay": { const given = Number(String(ui.cashGiven).replace(/\D/g, "")) || cartTotals().total; checkout(ui.payMethod, ui.payMethod === "CASH" ? given : undefined); break; }
    case "close": closeModal(); if (ui.view === "pos") document.getElementById("scan")?.focus(); break;
    case "ofilter": ui.orderFilter = t.dataset.f; render(); break;
    case "order": openOrder(t.dataset.code); break;
    case "cancel-order": cancelOrder(t.dataset.code); break;
    case "new-product": openProduct(null); break;
    case "edit-product": openProduct(t.dataset.id); break;
    case "tab": ui.tab[t.dataset.scope] = t.dataset.tab; render(); break;
    case "receive": openStock(t.dataset.id, "receive"); break;
    case "count": openStock(t.dataset.id, "count"); break;
    case "toggle-staff": { const u = S.staff.find((x) => x.id === t.dataset.id); u.active = !u.active; save(); toast(u.active ? `Đã mở khóa ${u.name}` : `Đã khóa ${u.name}`); render(); break; }
    case "connect": { const c = S.channels[t.dataset.ch]; Object.assign(c, { connected: true, since: Date.now(), secret: randomHex(24) }); save(); toast(`Đã kết nối ${CHANNEL_INFO[t.dataset.ch].name}, đã cấp secret webhook mới`); render(); break; }
    case "disconnect": S.channels[t.dataset.ch].connected = false; save(); toast(`Đã ngắt ${CHANNEL_INFO[t.dataset.ch].name}, đơn mới từ sàn sẽ bị từ chối`); render(); break;
    case "mapping": openMapping(t.dataset.ch); break;
    case "automap": { const ch = t.dataset.ch, c = S.channels[ch]; let n = 0; for (const p of S.products) if (p.active && !c.map[p.id]) { c.map[p.id] = PLATFORM[ch].prefix + "-" + p.sku; n++; } save(); toast(`Đã liên kết thêm ${n} sản phẩm`); render(); openMapping(ch); break; }
    case "save-store": saveStore(); break;
    case "ifilter": ui.invFilter = t.dataset.f; render(); break;
    case "new-promo": openPromo(null); break;
    case "edit-promo": openPromo(t.dataset.id); break;
    case "toggle-promo": { const k = S.promos.find((x) => x.id === t.dataset.id); k.active = !k.active; save(); toast(k.active ? `Đã bật lại ${k.name}` : `Đã tạm dừng ${k.name}`); render(); break; }
    case "clear-image": ui.draftImage = null; document.getElementById("f-thumb").innerHTML = thumb({ ...ui.editing, image: null }, "lg"); t.remove(); break;
    case "go-settings": closeModal(); go("settings"); break;
    case "days": ui.days = Number(t.dataset.d); render(); break;
    case "sim": simulateOnlineOrder(t.dataset.ch); break;
  }
});
document.addEventListener("change", (e) => {
  const t = e.target;
  if (t.id === "discount") { ui.discountPct = Number(t.value); render(); }
  if (t.dataset.act === "sku") {
    const c = S.channels[t.dataset.ch], sku = t.value.trim();
    const clash = sku && Object.entries(c.map).find(([pid, v]) => v === sku && pid !== t.dataset.id);
    if (clash) { toast(`SKU ${sku} đã gán cho ${prod(clash[0]).name}`); t.value = c.map[t.dataset.id] ?? ""; return; }
    if (sku) c.map[t.dataset.id] = sku; else delete c.map[t.dataset.id];
    save(); toast(sku ? "Đã lưu liên kết" : "Đã bỏ liên kết"); render();
  }
  if (t.dataset.act === "role") { const u = S.staff.find((x) => x.id === t.dataset.id); u.role = t.value; save(); toast(`${u.name} giờ là ${S.roles[u.role].name}`); render(); }
  if (t.dataset.act === "perm") {
    const r = S.roles[t.dataset.role];
    r.perms = t.checked ? [...r.perms, t.dataset.perm] : r.perms.filter((p) => p !== t.dataset.perm);
    save(); toast("Đã lưu phân quyền");
  }
});
document.addEventListener("input", (e) => {
  const t = e.target;
  if (t.id === "scan") { ui.q = t.value; const pos = t.selectionStart; render(); const el = document.getElementById("scan"); el.focus(); el.setSelectionRange(pos, pos); }
  for (const [id, key] of [["oq", "orderQ"], ["iq", "invQ"], ["voucher", "voucher"]]) if (t.id === id) { ui[key] = t.value; const pos = t.selectionStart; render(); const el = document.getElementById(id); el.focus(); el.setSelectionRange(pos, pos); }
  if (t.id === "pq") { ui.productQ = t.value; const pos = t.selectionStart; render(); const el = document.getElementById("pq"); el.focus(); el.setSelectionRange(pos, pos); }
  if (t.id === "cash") {
    ui.cashGiven = t.value.replace(/\D/g, "");
    const total = cartTotals().total, given = Number(ui.cashGiven) || 0;
    const out = t.closest(".card-b").querySelector(".total .num");
    out.textContent = given ? (given >= total ? money(given - total) : "Chưa đủ") : "—";
    out.classList.toggle("down", !!given && given < total);
    t.closest(".card-b").querySelector('[data-act="confirm-pay"]').disabled = !!given && given < total;
  }
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") closeModal();
  if (e.key === "Enter" && e.target.id === "scan") {
    const q = ui.q.trim().toLowerCase();
    const exact = S.products.find((p) => p.barcode === q || p.sku.toLowerCase() === q);
    const matches = S.products.filter((p) => p.active && p.name.toLowerCase().includes(q));
    const hit = exact ?? (matches.length === 1 ? matches[0] : null);
    if (hit) { ui.q = ""; addToCart(hit.id); }
  }
});
window.addEventListener("hashchange", render);
render();
</script>
