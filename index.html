<title>Retail POS Demo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<style>
/* Bố cục: khung quản trị (thanh menu trái + nội dung), màn POS hai cột giỏ hàng / danh mục */
:root {
  --bg: #f4f6fa; --surface: #ffffff; --surface-2: #f8fafc; --line: #e3e8f0; --line-strong: #cbd3df;
  --fg: #0f172a; --muted: #5b6577; --faint: #94a0b3;
  --brand: #1b64e0; --brand-strong: #1650b5; --brand-soft: #eaf2ff; --on-brand: #ffffff;
  --good: #047857; --good-soft: #e7f6ef; --warn: #b45309; --warn-soft: #fdf3e2; --bad: #c62828; --bad-soft: #fdecec;
  --shopee: #ee4d2d; --tiktok: #111827; --lazada: #1a2d8f;
  --font-ui: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0d1220; --surface: #151c2c; --surface-2: #1a2235; --line: #263049; --line-strong: #34405c;
  --fg: #e8edf6; --muted: #a2adc2; --faint: #6c7892;
  --brand: #5b95f7; --brand-strong: #84aff9; --brand-soft: #1b2a48; --on-brand: #0b1220;
  --good: #4ade9a; --good-soft: #12301f; --warn: #f4b453; --warn-soft: #33260f; --bad: #f87171; --bad-soft: #3a1717;
  --tiktok: #e8edf6; --lazada: #8b9cf5;
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #0d1220; --surface: #151c2c; --surface-2: #1a2235; --line: #263049; --line-strong: #34405c;
  --fg: #e8edf6; --muted: #a2adc2; --faint: #6c7892;
  --brand: #5b95f7; --brand-strong: #84aff9; --brand-soft: #1b2a48; --on-brand: #0b1220;
  --good: #4ade9a; --good-soft: #12301f; --warn: #f4b453; --warn-soft: #33260f; --bad: #f87171; --bad-soft: #3a1717;
  --tiktok: #e8edf6; --lazada: #8b9cf5;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-ui); font-size: 14px; line-height: 1.5; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--font-mono); font-size: 12px; }
h1, h2, h3 { margin: 0; text-wrap: balance; }

/* ---------- đăng nhập ---------- */
.login { min-height: 100%; display: grid; place-items: center; padding-block: 32px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.login-card { width: 100%; max-width: 420px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 32px; display: grid; gap: 20px; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 16px; }
.brand-mark { width: 34px; height: 34px; border-radius: 9px; background: var(--brand); color: var(--on-brand); display: grid; place-items: center; }
.role-pick { display: grid; gap: 10px; }
.role-btn { display: flex; justify-content: space-between; align-items: center; gap: 12px; text-align: left; padding: 14px 16px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface-2); }
.role-btn:hover { border-color: var(--brand); background: var(--brand-soft); }
.role-btn small { display: block; color: var(--muted); font-size: 12px; }
.demo-note { font-size: 12px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 14px; }

/* ---------- khung ---------- */
.shell { display: flex; min-height: 100%; }
.side { width: 232px; flex-shrink: 0; background: var(--surface); border-right: 1px solid var(--line); display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; }
.side .brand { height: 64px; padding: 0 18px; }
.nav { flex: 1; padding: 6px 10px; display: grid; gap: 2px; align-content: start; overflow-y: auto; }
.nav a { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 8px; color: var(--muted); text-decoration: none; font-weight: 500; }
.nav a:hover { background: var(--surface-2); color: var(--fg); }
.nav a.on { background: var(--brand-soft); color: var(--brand-strong); }
.nav svg { width: 17px; height: 17px; flex-shrink: 0; }
.me { border-top: 1px solid var(--line); padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.me small { display: block; color: var(--muted); font-size: 12px; }
.main { flex: 1; min-width: 0; padding-block: 28px 48px; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); }
.topbar { display: none; }
.page-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 20px; }
.page-head h1 { font-size: 22px; font-weight: 650; }
.page-head p { margin: 2px 0 0; color: var(--muted); }
.banner { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; font-size: 12.5px; color: var(--muted); background: var(--surface); border: 1px dashed var(--line-strong); border-radius: var(--radius); padding: 8px 14px; margin-bottom: 20px; }

@media (max-width: 860px) {
  .shell { flex-direction: column; }
  .side { display: none; }
  .topbar { display: flex; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); gap: 6px; overflow-x: auto; padding-block: 8px; padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
  .topbar a { white-space: nowrap; padding: 6px 12px; border-radius: 999px; text-decoration: none; color: var(--muted); font-weight: 500; font-size: 13px; }
  .topbar a.on { background: var(--brand-soft); color: var(--brand-strong); }
  .main { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 18px 40px; }
}

/* ---------- thành phần ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); min-width: 0; }
.card-h { padding: 14px 18px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.card-h h3 { font-size: 15px; font-weight: 600; }
.card-b { padding: 16px 18px; }
.grid { display: grid; gap: 16px; }
.kpis { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.two { grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); }
@media (max-width: 1100px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } .two { grid-template-columns: minmax(0, 1fr); } }
.kpi { padding: 16px 18px; display: grid; gap: 4px; }
.kpi .l { color: var(--muted); font-size: 13px; }
.kpi .v { font-size: 24px; font-weight: 650; letter-spacing: -0.01em; }
.kpi .h { font-size: 12px; color: var(--muted); }
.up { color: var(--good); } .down { color: var(--bad); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 38px; padding: 0 16px; border-radius: 8px; border: 1px solid transparent; font-weight: 550; background: var(--brand); color: var(--on-brand); white-space: nowrap; }
.btn:hover { background: var(--brand-strong); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.sec { background: var(--surface); color: var(--fg); border-color: var(--line-strong); }
.btn.sec:hover { background: var(--surface-2); }
.btn.ghost { background: transparent; color: var(--muted); }
.btn.ghost:hover { background: var(--surface-2); color: var(--fg); }
.btn.sm { height: 30px; padding: 0 10px; font-size: 13px; }
.btn.lg { height: 48px; font-size: 15px; }
.input, .select { height: 38px; width: 100%; border: 1px solid var(--line-strong); border-radius: 8px; background: var(--surface); padding: 0 12px; }
.input:focus, .select:focus { outline: 2px solid var(--brand-soft); border-color: var(--brand); }
.field { display: grid; gap: 4px; font-size: 13px; }
.field > span { font-weight: 500; color: var(--muted); }
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-size: 11.5px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); padding: 10px 14px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 10px 14px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
td.r, th.r { text-align: right; }
td small { display: block; color: var(--muted); font-size: 12px; }
.pill { display: inline-flex; align-items: center; gap: 4px; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 550; white-space: nowrap; background: var(--surface-2); color: var(--muted); }
.pill.good { background: var(--good-soft); color: var(--good); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.brand { background: var(--brand-soft); color: var(--brand-strong); }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 16px; overflow-x: auto; }
.tabs button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 8px 14px; color: var(--muted); font-weight: 550; margin-bottom: -1px; white-space: nowrap; }
.tabs button.on { color: var(--brand-strong); border-color: var(--brand); }
.toolbar { display: flex; flex-wrap: wrap; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--line); }
.toolbar .input { max-width: 300px; }
.toolbar .select { max-width: 200px; }
.empty { padding: 32px; text-align: center; color: var(--muted); }
.list-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.list-row:last-child { border-bottom: 0; }
.toast { position: fixed; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 10px 18px; border-radius: 999px; font-weight: 550; z-index: 50; width: max-content; text-align: center; box-shadow: 0 8px 24px rgba(0,0,0,.18); max-width: calc(100% - 32px); }

/* ---------- POS ---------- */
.pos { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 16px; align-items: start; }
@media (max-width: 1100px) { .pos { grid-template-columns: minmax(0, 1fr); } .cart { order: -1; position: static; max-height: none; } }
.cats { display: flex; gap: 6px; flex-wrap: wrap; padding: 0 18px 14px; }
.chip { border: 1px solid var(--line-strong); background: var(--surface); border-radius: 999px; padding: 4px 12px; font-size: 13px; color: var(--muted); }
.chip.on { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); gap: 10px; padding: 0 18px 18px; }
.tile { text-align: left; border: 1px solid var(--line); background: var(--surface-2); border-radius: var(--radius); padding: 12px; display: grid; gap: 6px; min-height: 108px; align-content: space-between; }
.tile:hover { border-color: var(--brand); }
.tile:disabled { opacity: .45; }
.tile .n { font-weight: 550; font-size: 13px; line-height: 1.35; }
.tile { position: relative; }
.thumb { display: grid; place-items: center; border-radius: 8px; overflow: hidden; background: var(--thumb-bg, var(--surface)); flex: none; }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb .e { line-height: 1; }
.tile .thumb { width: 100%; aspect-ratio: 4 / 3; }
.tile .thumb .e { font-size: 40px; }
.tile .promo-tag { position: absolute; top: 8px; left: 8px; background: var(--bad); color: #fff; font-size: 11px; font-weight: 650; padding: 1px 6px; border-radius: 6px; }
.thumb.sm { width: 36px; height: 36px; } .thumb.sm .e { font-size: 20px; }
.thumb.lg { width: 96px; height: 96px; } .thumb.lg .e { font-size: 48px; }
.cat-0 { --thumb-bg: #e6f0ff; } .cat-1 { --thumb-bg: #fff1e0; } .cat-2 { --thumb-bg: #fdf6d8; } .cat-3 { --thumb-bg: #e9f8ef; } .cat-4 { --thumb-bg: #f1ecfd; } .cat-5 { --thumb-bg: #fdebf1; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .thumb { --thumb-bg: var(--surface-2); } }
:root[data-theme="dark"] .thumb { --thumb-bg: var(--surface-2); }
.search-bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.search-bar .input { flex: 1; min-width: 200px; }
.promo-line { color: var(--good); }
.voucher { display: flex; gap: 6px; }
.voucher .input { height: 30px; font-family: var(--font-mono); font-size: 12.5px; text-transform: uppercase; }
.tile .p { font-weight: 650; color: var(--brand-strong); }
.tile .s { font-size: 11.5px; color: var(--muted); }
.cart { position: sticky; top: 20px; display: flex; flex-direction: column; max-height: calc(100vh - 40px); }
.cart-items { overflow-y: auto; flex: 1; padding: 4px 18px; min-height: 120px; }
.ci { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.ci .n { font-weight: 550; font-size: 13px; }
.qty { display: inline-flex; align-items: center; border: 1px solid var(--line-strong); border-radius: 8px; overflow: hidden; }
.qty button { width: 28px; height: 28px; border: 0; background: var(--surface-2); }
.qty span { min-width: 30px; text-align: center; font-weight: 600; }
.sum { padding: 14px 18px; border-top: 1px solid var(--line); display: grid; gap: 6px; }
.sum .row { display: flex; justify-content: space-between; gap: 12px; }
.sum .total { font-size: 20px; font-weight: 700; }
.scan { display: flex; gap: 8px; padding: 14px 18px; }

/* ---------- hộp thoại ---------- */
.overlay { position: fixed; inset: 0; background: rgba(8, 12, 22, .55); display: grid; place-items: center; z-index: 40; padding-block: 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.dialog { background: var(--surface); border-radius: 14px; width: 100%; max-width: 460px; max-height: 100%; overflow-y: auto; border: 1px solid var(--line); }
.dialog .card-b { display: grid; gap: 14px; }
.methods { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.method { border: 1.5px solid var(--line-strong); background: var(--surface); border-radius: var(--radius); padding: 12px; font-weight: 600; }
.method.on { border-color: var(--brand); background: var(--brand-soft); color: var(--brand-strong); }
.quick { display: flex; flex-wrap: wrap; gap: 6px; }
.qr { display: grid; justify-items: center; gap: 8px; padding: 12px; border: 1px solid var(--line); border-radius: var(--radius); background: #ffffff; color: #0f172a; }
.qr svg { width: 220px; height: 220px; max-width: 100%; }
.qr .bank { font-size: 12px; text-align: center; color: #475569; }
.receipt { font-family: var(--font-mono); font-size: 12px; background: var(--surface-2); border: 1px dashed var(--line-strong); border-radius: 8px; padding: 14px; display: grid; gap: 4px; }
.receipt .row { display: flex; justify-content: space-between; gap: 8px; }
.receipt hr { border: 0; border-top: 1px dashed var(--line-strong); margin: 6px 0; width: 100%; }

/* ---------- biểu đồ ---------- */
.chart svg { width: 100%; height: auto; display: block; }
.chart text { fill: var(--muted); font-size: 11px; font-family: var(--font-ui); }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12.5px; color: var(--muted); }
.bar-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; padding: 7px 0; }
.bar-track { grid-column: 1 / -1; height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; }
.bar-fill { height: 100%; background: var(--brand); border-radius: 3px; }

/* ---------- phân quyền / kênh ---------- */
.matrix td, .matrix th { text-align: center; }
.matrix td:first-child, .matrix th:first-child { text-align: left; }
.matrix input { width: 17px; height: 17px; accent-color: var(--brand); }
.channels { grid-template-columns: repeat(3, minmax(0, 1fr)); }
@media (max-width: 1000px) { .channels { grid-template-columns: minmax(0, 1fr); } }
.seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 8px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: none; padding: 6px 12px; color: var(--muted); font-size: 13px; }
.seg button.on { background: var(--fg); color: var(--bg); font-weight: 600; }
.stat3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; background: var(--surface-2); border-radius: 8px; padding: 10px; text-align: center; }
.stat3 small { display: block; color: var(--muted); font-size: 11.5px; }
.stat3 b { font-size: 15px; }
.flow { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
@media (max-width: 900px) { .flow { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 520px) { .flow { grid-template-columns: minmax(0, 1fr); } }
.flow-step { display: flex; gap: 10px; }
.flow-step .n { flex: none; width: 26px; height: 26px; border-radius: 50%; background: var(--brand-soft); color: var(--brand-strong); font-weight: 650; font-size: 13px; display: grid; place-items: center; }
.flow-step b { display: block; }
.flow-step span { color: var(--muted); font-size: 13px; }
.code-box { background: #0f172a; color: #e2e8f0; border-radius: 8px; padding: 12px; font-family: var(--font-mono); font-size: 11.5px; line-height: 1.55; max-height: 260px; overflow: auto; white-space: pre; margin: 0; }
.dialog.wide { max-width: 640px; }
.sku-input { height: 30px; width: 150px; font-family: var(--font-mono); font-size: 12px; }
.ch-logo { width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 13px; }
/* ---------- khách hàng, chờ tiền về, trợ lý AI ---------- */
.cust-box { padding: 12px 18px; border-top: 1px solid var(--line); display: grid; gap: 8px; }
.cust-box .hit { display: flex; justify-content: space-between; align-items: center; gap: 8px; width: 100%; text-align: left; padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface-2); font-size: 13px; }
.cust-box .hit:hover { border-color: var(--brand); }
.cust-card { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
.check { display: flex; align-items: center; gap: 8px; font-size: 13px; }
.check input { width: 16px; height: 16px; accent-color: var(--brand); }
.wait { display: flex; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 8px; background: var(--brand-soft); color: var(--brand-strong); font-size: 13px; }
.wait.ok { background: var(--good-soft); color: var(--good); }
.spinner { flex: none; width: 16px; height: 16px; border-radius: 50%; border: 2px solid currentColor; border-right-color: transparent; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.tiers { grid-template-columns: repeat(4, minmax(0, 1fr)); }
@media (max-width: 900px) { .tiers { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.tier-bar { height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; }
.tier-bar > div { height: 100%; background: var(--brand); }
.ai-wrap { grid-template-columns: minmax(0, 3fr) minmax(0, 1.3fr); align-items: start; }
@media (max-width: 1000px) { .ai-wrap { grid-template-columns: minmax(0, 1fr); } }
.chat { display: flex; flex-direction: column; height: min(640px, calc(100vh - 200px)); min-height: 420px; }
.chat-log { flex: 1; overflow-y: auto; padding: 16px 18px; display: grid; gap: 14px; align-content: start; }
.msg { max-width: 88%; padding: 10px 14px; border-radius: 12px; font-size: 13.5px; line-height: 1.55; }
.msg.user { justify-self: end; background: var(--brand); color: var(--on-brand); border-bottom-right-radius: 4px; }
.msg.bot { justify-self: start; background: var(--surface-2); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
.msg.bot p { margin: 0 0 6px; } .msg.bot p:last-child { margin-bottom: 0; }
.msg.bot ul { margin: 4px 0 6px; padding-left: 18px; }
.msg.bot table { margin: 6px 0; font-size: 12.5px; }
.msg.bot th, .msg.bot td { padding: 5px 8px; }
.tools { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 8px; }
.tool { font-family: var(--font-mono); font-size: 11px; padding: 1px 7px; border-radius: 6px; background: var(--surface); border: 1px solid var(--line); color: var(--muted); }
.chat-in { display: flex; gap: 8px; padding: 12px 18px; border-top: 1px solid var(--line); }
.suggest { display: grid; gap: 6px; }
.suggest button { text-align: left; border: 1px solid var(--line); background: var(--surface-2); border-radius: 8px; padding: 8px 12px; font-size: 13px; }
.suggest button:hover { border-color: var(--brand); color: var(--brand-strong); }

<script>
// ===================== Dữ liệu và quyền =====================
const PERMS = {

  "payment.reconcile": "Đối soát tiền chuyển khoản",
  "ai.use": "Dùng trợ lý AI hỏi báo cáo",
};
// Khách hàng thân thiết: 10.000 ₫ = 1 điểm (nhân hệ số hạng), 1 điểm = 100 ₫ khi đổi, đổi từ 100 điểm
const POINT_PER = 10000, POINT_VALUE = 100, MIN_REDEEM = 100;
const TIERS = [
  { k: "DONG", name: "Đồng", min: 0, rate: 1, tone: "" },
  { k: "BAC", name: "Bạc", min: 2000000, rate: 1.2, tone: "brand" },
  { k: "VANG", name: "Vàng", min: 5000000, rate: 1.5, tone: "warn" },
  { k: "KC", name: "Kim cương", min: 15000000, rate: 2, tone: "good" },
];
const tierOf = (spent) => [...TIERS].reverse().find((t) => spent >= t.min);
const earnPoints = (total, spentBefore) => Math.floor((total / POINT_PER) * tierOf(spentBefore).rate);
const RETURN_REASONS = ["Hàng lỗi, hỏng", "Khách đổi ý", "Sai sản phẩm, sai mẫu", "Hết hạn sử dụng", "Lý do khác"];
const REFUND_LABEL = { CASH: "Tiền mặt", TRANSFER: "Chuyển khoản", EXCHANGE: "Đổi hàng (trừ vào đơn mới)", CHANNEL: "Hoàn qua sàn" };
// Tiền hoàn chia đều phần giảm giá của đơn theo tỉ lệ; lần trả cuối cùng hoàn nốt phần còn lại để khớp từng đồng
function refundAmount(o, picks) {
  const left = o.total - (o.refunded || 0);
  const ratio = o.subtotal ? o.total / o.subtotal : 1;
  let amount = 0, all = true;
  for (const it of o.items) { const q = picks[it.pid] || 0; amount += it.price * q * ratio; if ((it.ret || 0) + q < it.qty) all = false; }
  return all ? left : Math.min(left, Math.round(amount / 100) * 100);
}
// Mã đơn trong nội dung chuyển khoản; app ngân hàng hay bỏ dấu gạch nên chấp nhận cả DH20261102-0012 lẫn DH202611020012
function codeInContent(content) {
  const m = String(content).toUpperCase().match(/DH(\d{8})-?(\d{4})/);
  return m ? `DH${m[1]}-${m[2]}` : null;
}
const STORE_DEFAULT = { name: "Cửa hàng Tiện Lợi Xanh", address: "123 Nguyễn Trãi, Thanh Xuân, Hà Nội", phone: "0243 868 6868", bankBin: "970436", account: "0011004000000", holder: "CUA HANG TIEN LOI XANH" };
const BANKS = [["970436", "Vietcombank"], ["970415", "VietinBank"], ["970418", "BIDV"], ["970405", "Agribank"], ["970407", "Techcombank"], ["970422", "MB Bank"], ["970416", "ACB"], ["970432", "VPBank"], ["970423", "TPBank"], ["970403", "Sacombank"]];
const bankName = (bin) => BANKS.find(([b]) => b === bin)?.[1] ?? bin;
const CHANNEL_INFO = {
  SHOPEE: { name: "Shopee", color: "var(--shopee)", short: "S" },
  TIKTOK: { name: "TikTok Shop", color: "var(--tiktok)", short: "T" },
  LAZADA: { name: "Lazada", color: "var(--lazada)", short: "L" },
};
const SOURCE_LABEL = { POS: "Tại quầy", SHOPEE: "Shopee", TIKTOK: "TikTok Shop", LAZADA: "Lazada" };
const METHOD_LABEL = { CASH: "Tiền mặt", VIETQR: "VietQR", CHANNEL: "Sàn thanh toán", EXCHANGE: "Trừ hàng trả lại" };
const MOVE_LABEL = { RECEIPT: ["Nhập kho", "good"], SALE: ["Bán tại quầy", "brand"], ONLINE_SALE: ["Bán online", "brand"], ADJUSTMENT: ["Kiểm kê", "warn"], RETURN: ["Hoàn hàng", ""] };

const CATALOG = {
  "Đồ uống": [["Nước suối Aquafina 500ml", 6000, "chai"], ["Coca-Cola lon 330ml", 10000, "lon"], ["Pepsi lon 330ml", 10000, "lon"], ["Trà xanh 0 độ 455ml", 10000, "chai"], ["Sữa tươi Vinamilk 180ml", 8000, "hộp"], ["Cà phê G7 hòa tan (hộp 18 gói)", 52000, "hộp"], ["Red Bull lon 250ml", 12000, "lon"], ["Nước cam Twister 455ml", 12000, "chai"]],
  "Bánh kẹo": [["Bánh Oreo 133g", 22000, "gói"], ["Bánh ChocoPie hộp 12 cái", 55000, "hộp"], ["Snack Lay's vị tự nhiên 52g", 15000, "gói"], ["Kẹo Alpenliebe gói 120g", 18000, "gói"], ["Bánh quy Cosy 240g", 32000, "gói"], ["Bánh gạo One One 150g", 25000, "gói"], ["Socola KitKat 4 thanh", 20000, "thanh"], ["Hạt điều rang muối 200g", 75000, "gói"]],
  "Thực phẩm khô": [["Mì Hảo Hảo tôm chua cay", 4500, "gói"], ["Phở bò Vifon", 9000, "gói"], ["Gạo ST25 túi 5kg", 185000, "túi"], ["Dầu ăn Neptune 1L", 58000, "chai"], ["Nước mắm Nam Ngư 500ml", 36000, "chai"], ["Đường Biên Hòa 1kg", 28000, "gói"], ["Hạt nêm Knorr 400g", 42000, "gói"], ["Cá hộp 3 Cô Gái 155g", 22000, "hộp"]],
  "Hóa mỹ phẩm": [["Dầu gội Clear 340g", 98000, "chai"], ["Sữa tắm Lifebuoy 850g", 145000, "chai"], ["Kem đánh răng P/S 230g", 38000, "tuýp"], ["Bàn chải Colgate", 25000, "cái"], ["Nước rửa chén Sunlight 750g", 32000, "chai"], ["Bột giặt OMO 800g", 52000, "gói"], ["Giấy vệ sinh Pulppy 10 cuộn", 78000, "lốc"], ["Khăn giấy Kleenex hộp", 28000, "hộp"]],
  "Gia dụng": [["Pin AA Panasonic vỉ 4", 30000, "vỉ"], ["Bóng đèn LED Rạng Đông 9W", 45000, "cái"], ["Túi rác cuộn 3 cuộn", 25000, "lốc"], ["Hộp nhựa đựng thực phẩm 1L", 35000, "cái"], ["Bật lửa gas", 8000, "cái"], ["Khăn lau đa năng", 15000, "cái"], ["Ly nhựa (50 cái)", 20000, "lốc"], ["Đũa tre (10 đôi)", 12000, "lốc"]],
  "Văn phòng phẩm": [["Bút bi Thiên Long TL-027", 5000, "cây"], ["Vở kẻ ngang 200 trang", 18000, "quyển"], ["Băng keo trong 5cm", 15000, "cuộn"], ["Kéo văn phòng", 22000, "cái"], ["Giấy A4 Double A 500 tờ", 95000, "ram"], ["Bút dạ quang", 10000, "cây"], ["Hồ dán", 6000, "lọ"], ["Thước kẻ 30cm", 7000, "cái"]],
};

// Ảnh minh họa mặc định theo từng sản phẩm; cửa hàng có thể tải ảnh thật lên ở trang Sản phẩm
const ART = ["💧","🥤","🥤","🍵","🥛","☕","⚡","🍊", "🍪","🍫","🍟","🍬","🍪","🍘","🍫","🥜", "🍜","🍲","🍚","🫗","🐟","🧂","🧄","🥫", "🧴","🧴","🪥","🪥","🧽","🧺","🧻","🤧", "🔋","💡","🗑️","🥡","🔥","🧽","🥤","🥢", "🖊️","📒","📦","✂️","📄","🖍️","🧴","📏"];
const CATS = () => Object.keys(CATALOG);
function thumb(p, size = "") {
  const cls = `thumb ${size} cat-${Math.max(0, CATS().indexOf(p.cat))}`;
  return p.image ? `<span class="${cls}"><img src="${p.image}" alt="${esc(p.name)}"></span>` : `<span class="${cls}" role="img" aria-label="${esc(p.name)}"><span class="e">${p.art || "📦"}</span></span>`;
}
function rng(seed) { return () => (seed = (seed * 1664525 + 1013904223) % 4294967296) / 4294967296; }

function seedState() {
  const r = rng(42);
  const products = [];
  let n = 0;
  for (const [cat, items] of Object.entries(CATALOG)) {
    for (const [name, price, unit] of items) {
      n++;
      products.push({
        id: "p" + n, sku: "SP" + String(n).padStart(4, "0"), barcode: "893" + String(1000000000 + n * 7919).slice(0, 10),
        name, cat, unit, price, cost: Math.round(price * (0.65 + r() * 0.15) / 100) * 100,
        qty: Math.floor(r() * 120), threshold: 10, active: true, art: ART[n - 1],
      });
    }
  }
  // Vài mặt hàng sắp hết để dashboard có cảnh báo thật
  products[4].qty = 6; products[16].qty = 3; products[29].qty = 0; products[41].qty = 8;

  const staff = [
    { id: "u1", name: "Nguyễn Văn An", email: "chu@demo.vn", role: "owner", active: true },
    { id: "u2", name: "Trần Thị Bình", email: "quanly@demo.vn", role: "manager", active: true },
    { id: "u3", name: "Lê Minh Châu", email: "thungan@demo.vn", role: "cashier", active: true },
    { id: "u4", name: "Phạm Thu Dung", email: "dung@demo.vn", role: "cashier", active: true },
  ];
  const roles = {
    owner: { name: "Chủ cửa hàng", perms: Object.keys(PERMS), locked: true },
    manager: { name: "Quản lý", perms: ["order.create", "order.discount", "order.cancel", "product.view", "product.manage", "inventory.manage", "report.view", "promo.manage", "customer.manage", "payment.reconcile", "ai.use"] },
    cashier: { name: "Thu ngân", perms: ["order.create", "product.view", "report.view_own"] },
  };

  const DAY = 86400000, t0 = startOfDay(Date.now());
  const promos = [
    { id: "km1", name: "Đồ uống giảm 10%", type: "PERCENT_ITEM", value: 10, scope: "cat", target: "Đồ uống", min: 0, max: 0, code: "", from: t0 - 6 * DAY, to: t0 + 24 * DAY, active: true },
    { id: "km2", name: "Bánh Oreo mua 3 tặng 1", type: "BUY_X_GET_1", value: 3, scope: "product", target: "p9", min: 0, max: 0, code: "", from: t0 - 3 * DAY, to: t0 + 11 * DAY, active: true },
    { id: "km3", name: "Đơn từ 300k giảm 20k", type: "FIXED_ORDER", value: 20000, scope: "all", target: "", min: 300000, max: 0, code: "", from: t0 - 20 * DAY, to: t0 + 40 * DAY, active: true },
    { id: "km4", name: "Mã KHAITRUONG giảm 15%", type: "PERCENT_ORDER", value: 15, scope: "all", target: "", min: 100000, max: 50000, code: "KHAITRUONG", from: t0 - 2 * DAY, to: t0 + 5 * DAY, active: true },
    { id: "km5", name: "Tri ân tháng trước giảm 5%", type: "PERCENT_ORDER", value: 5, scope: "all", target: "", min: 200000, max: 30000, code: "", from: t0 - 45 * DAY, to: t0 - 21 * DAY, active: true },
    { id: "km6", name: "Giờ vàng 8h-10h", type: "PERCENT_ORDER", value: 8, scope: "all", target: "", min: 50000, max: 20000, code: "", from: t0 - 10 * DAY, to: t0 + 20 * DAY, active: false },
  ];
  // 90 ngày đơn hàng mẫu, nhiều đơn hơn vào cuối tuần; mã đơn đánh số lại mỗi ngày theo giờ bán
  const orders = [];
  const now = new Date();
  // Khách thân thiết: vài khách quen mua rất thường xuyên nên lên hạng cao, đa số mua thưa
  const CUST_NAMES = ["Nguyễn Thị Lan", "Trần Văn Hùng", "Lê Thu Trang", "Phạm Minh Tuấn", "Hoàng Thị Mai", "Vũ Đức Anh", "Đặng Ngọc Ánh", "Bùi Quang Huy", "Đỗ Thị Hương", "Ngô Văn Long", "Dương Thu Hà", "Lý Minh Khang", "Phan Thị Ngọc", "Trịnh Văn Nam", "Đinh Thị Thảo", "Mai Quốc Việt", "Tạ Thị Yến", "Hồ Văn Phúc", "Cao Thị Linh", "Lâm Gia Bảo", "Kiều Thị Nhung", "Châu Văn Tài", "Quách Thị Hoa", "Tống Minh Đức"];
  const customers = CUST_NAMES.map((name, i) => ({ id: "c" + (i + 1), name, phone: i === 0 ? "0901234567" : "09" + String(Math.floor(10000000 + r() * 89999999)), points: 0, spent: 0, orders: 0, last: null, joined: t0 - (92 + i * 4) * DAY }));
  for (let d = 89; d >= 0; d--) {
    const day = new Date(now); day.setDate(now.getDate() - d);
    const weekend = [0, 6].includes(day.getDay());
    const count = Math.floor((weekend ? 30 : 18) + r() * 12);
    const s0 = startOfDay(day.getTime());
    // Đơn hôm nay rải đều từ đầu ngày tới giờ hiện tại, để trang tổng quan luôn có số liệu
    const lo = d === 0 && now.getTime() - s0 > 8 * 3600000 ? s0 + 7 * 3600000 : s0;
    const times = Array.from({ length: count }, () => d === 0 ? lo + r() * (now.getTime() - lo) : s0 + (7 + r() * 14) * 3600000).sort((a, b) => a - b);
    let seq = 0;
    for (let i = 0; i < count; i++) {
      const t = new Date(times[i]);
      const online = r() < 0.22;
      const source = online ? ["SHOPEE", "SHOPEE", "TIKTOK"][Math.floor(r() * 3)] : "POS";
      const items = [];
      const lines = 1 + Math.floor(r() * 4);
      for (let k = 0; k < lines; k++) {
        const p = products[Math.floor(r() * products.length)];
        if (items.some((x) => x.pid === p.id)) continue;
        items.push({ pid: p.id, name: p.name, qty: 1 + Math.floor(r() * 3), price: p.price, cost: p.cost });
      }
      const subtotal = items.reduce((s, x) => s + x.qty * x.price, 0);
      // Đơn mẫu tại quầy cũng hưởng khuyến mãi theo đơn đang chạy vào ngày đó
      const orderPromo = online ? null : promos.find((k) => !k.code && k.active && (k.type === "FIXED_ORDER" || k.type === "PERCENT_ORDER") && t.getTime() >= k.from && t.getTime() < k.to + DAY && subtotal >= k.min);
      const promoAmount = orderPromo ? promoOrderAmount(orderPromo, subtotal) : 0;
      const manual = !online && !orderPromo && subtotal > 150000 && r() < 0.2 ? Math.round(subtotal * 0.05 / 1000) * 1000 : 0;
      seq++;
      const status = r() < 0.015 ? "CANCELLED" : "PAID";
      // Khoảng 40% đơn tại quầy có khách đọc số điện thoại để tích điểm; khách nhiều điểm thỉnh thoảng đổi điểm
      let cust = null, points = 0, pointsEarned = 0;
      if (!online && r() < 0.4) {
        cust = customers[Math.floor(Math.pow(r(), 1.8) * customers.length)];
        const base = subtotal - promoAmount - manual;
        if (cust.points >= 500 && r() < 0.1) points = Math.min(Math.floor(cust.points / 100) * 100, Math.floor(base / POINT_VALUE));
      }
      const discount = promoAmount + manual + points * POINT_VALUE;
      const total = subtotal - discount;
      if (cust && status === "PAID") {
        pointsEarned = earnPoints(total, cust.spent);
        cust.points += pointsEarned - points; cust.spent += total; cust.orders++; cust.last = t.getTime();
      }
      orders.push({
        code: orderCode(t, seq), source, items, subtotal, discount, total, promos: orderPromo ? [{ id: orderPromo.id, name: orderPromo.name, amount: promoAmount }] : [], external: online ? String(Math.floor(2e14 + r() * 1e14)) : undefined,
        method: online ? "CHANNEL" : r() < 0.62 ? "CASH" : "VIETQR", status, manual: manual || undefined,
        at: t.getTime(), staff: online ? null : staff[1 + Math.floor(r() * 3)].name,
        customer: cust?.id, points: points || undefined, pointsEarned: pointsEarned || undefined,
      });
    }
  }

  const movements = [];
  for (const o of orders.slice(-40)) for (const it of o.items) movements.push({ at: o.at, pid: it.pid, type: o.source === "POS" ? "SALE" : "ONLINE_SALE", qty: -it.qty, ref: o.code, user: o.staff ?? "Hệ thống" });
  const rcAt = now.getTime() - 3 * 86400000;
  for (const p of products.slice(0, 6)) movements.push({ at: rcAt, pid: p.id, type: "RECEIPT", qty: 48, ref: "PN" + ymd(new Date(rcAt)) + "-001", user: "Trần Thị Bình" });

  // Phiếu trả hàng mẫu: vài đơn tại quầy trong 20 ngày qua trả lại một món
  const returns = [];
  const cands = orders.filter((o) => o.source === "POS" && o.status === "PAID" && o.items.length >= 2 && o.at > now.getTime() - 20 * DAY && o.at < now.getTime() - 3 * DAY);
  for (let i = 0; i < 7 && cands.length; i++) {
    const o = cands.splice(Math.floor(r() * cands.length), 1)[0];
    const it = o.items[Math.floor(r() * o.items.length)];
    const reason = RETURN_REASONS[Math.floor(r() * 4)];
    const amount = refundAmount(o, { [it.pid]: 1 });
    const at = o.at + (1 + r() * 2) * DAY;
    const restock = reason !== RETURN_REASONS[0] && reason !== RETURN_REASONS[3];
    const code = "TH" + ymd(new Date(at)) + "-" + String(returns.filter((x) => x.code.startsWith("TH" + ymd(new Date(at)))).length + 1).padStart(3, "0");
    const pointsBack = o.pointsEarned ? Math.round((o.pointsEarned * amount) / o.total) : 0;
    it.ret = 1; o.refunded = amount;
    returns.push({ code, order: o.code, at, items: [{ pid: it.pid, name: it.name, qty: 1, amount }], amount, reason, restock, method: o.method === "VIETQR" ? "TRANSFER" : "CASH", staff: "Trần Thị Bình", customer: o.customer, pointsBack });
    if (o.customer) { const c = customers.find((x) => x.id === o.customer); c.spent -= amount; c.points = Math.max(0, c.points - pointsBack); }
    if (restock) movements.push({ at, pid: it.pid, type: "RETURN", qty: 1, ref: code, user: "Trần Thị Bình" });
  }
  returns.sort((a, b) => b.at - a.at);
  movements.sort((a, b) => b.at - a.at);

  // Biến động số dư 30 ngày: đơn VietQR tự khớp qua mã đơn trong nội dung chuyển khoản;
  // vài khách gõ sai nội dung nên thu ngân phải xác nhận tay, giao dịch nằm chờ đối soát
  const bankTx = [];
  const SENDERS = ["NGUYEN THI LAN", "TRAN VAN HUNG", "LE THU TRANG", "PHAM MINH TUAN", "HOANG THI MAI", "VU DUC ANH", "BUI QUANG HUY"];
  const ftRef = (at) => "FT" + ymd(new Date(at)).slice(2) + String(Math.floor(r() * 1e8)).padStart(8, "0");
  for (const o of orders) {
    if (o.method !== "VIETQR" || o.status !== "PAID" || o.at < now.getTime() - 30 * DAY) continue;
    const at = Math.min(now.getTime(), o.at + (12 + r() * 60) * 1000);
    const ref = ftRef(at), sender = SENDERS[Math.floor(r() * SENDERS.length)];
    if (r() < 0.03) {
      o.confirm = "MANUAL";
      bankTx.push({ id: ref, at, amount: o.total, content: `${sender} ${["chuyen tien", "CK mua hang", "thanh toan tien hang"][Math.floor(r() * 3)]}`, status: "UNMATCHED", order: null });
    } else {
      o.confirm = "AUTO"; o.bankRef = ref;
      bankTx.push({ id: ref, at, amount: o.total, content: `${r() < 0.5 ? o.code : o.code.replace("-", "")} ${sender} chuyen khoan`, status: "MATCHED", order: o.code, auto: true });
    }
  }
  bankTx.push({ id: ftRef(now.getTime() - 2 * DAY), at: now.getTime() - 2 * DAY - 5 * 3600000, amount: 1250000, content: "NPP HOA PHAT HOAN TIEN CHENH LECH PN", status: "UNMATCHED", order: null });
  bankTx.push({ id: ftRef(now.getTime() - 5 * DAY), at: now.getTime() - 5 * DAY - 2 * 3600000, amount: 500000, content: "NGUYEN VAN AN NOP QUY TIEN LE", status: "IGNORED", order: null, note: "Chủ cửa hàng nộp tiền lẻ" });
  bankTx.sort((a, b) => b.at - a.at);

  return {
    v: 5, user: null, products, staff, roles, orders, movements, promos, customers, returns, bankTx, bankSecret: randomHex(20, r),

function itemPromo(p, qty) {
  let best = null;
  for (const k of S.promos) {
    if (!promoLive(k) || k.code || !promoHits(k, p)) continue;
    const amount = k.type === "PERCENT_ITEM" ? round1k((p.price * qty * k.value) / 100) : k.type === "BUY_X_GET_1" ? Math.floor(qty / (k.value + 1)) * p.price : 0;

  const subtotal = lines.reduce((s, l) => s + l.base, 0);
  const applied = lines.filter((l) => l.promo).map((l) => l.promo);
  const afterItems = subtotal - applied.reduce((s, a) => s + a.amount, 0);
  const code = ui.voucher.trim().toUpperCase();
  let orderBest = null, voucherError = "";
  for (const k of S.promos) {
    if (k.type !== "PERCENT_ORDER" && k.type !== "FIXED_ORDER") continue;
    if (k.code && k.code !== code) continue;
    if (!promoLive(k) || afterItems < k.min) continue;
    const amount = promoOrderAmount(k, afterItems);
    if (!orderBest || amount > orderBest.amount) orderBest = { id: k.id, name: k.name, amount };
  }
  if (code) {
    const v = S.promos.find((k) => k.code === code);
    if (!v) voucherError = "Mã không tồn tại";
    else if (!promoLive(v)) voucherError = `Mã ${promoStatus(v)[0].toLowerCase()}`;
    else if (afterItems < v.min) voucherError = `Cần đơn từ ${money(v.min)}`;
    else if (orderBest?.id !== v.id) voucherError = "Đơn đang hưởng khuyến mãi tốt hơn";
  }
  if (orderBest) applied.push(orderBest);
  const afterPromo = subtotal - applied.reduce((s, a) => s + a.amount, 0);
  const manual = round1k((afterPromo * ui.discountPct) / 100);
  // Đổi điểm tính sau cùng, sau mọi khuyến mãi và giảm giá tay; phiếu trả hàng (đổi hàng) là tiền khách đã trả nên trừ vào số phải thu, không tính là giảm giá
  const cust = ui.customer ? S.customers.find((c) => c.id === ui.customer) : null;
  const pointsUsed = cust && ui.usePoints && cust.points >= MIN_REDEEM ? Math.min(cust.points, Math.floor((afterPromo - manual) / POINT_VALUE)) : 0;
  const pointsAmount = pointsUsed * POINT_VALUE;
  const discount = subtotal - afterPromo + manual + pointsAmount;
  const total = subtotal - discount;
  const credit = ui.exchange ? Math.min(ui.exchange.amount, total) : 0;
  const pointsEarned = cust ? earnPoints(total, cust.spent) : 0;
  return { lines, subtotal, applied, manual, discount, total, voucherError, code, cust, pointsUsed, pointsAmount, pointsEarned, credit, due: total - credit };
}

function dailySeries(days, filter = () => true) {
  const out = [];
  const today = startOfDay(Date.now());
  for (let i = days - 1; i >= 0; i--) {
    const from = today - i * 86400000, to = from + 86400000;
    const list = paid().filter((o) => o.at >= from && o.at < to && filter(o));
    out.push({ day: from, revenue: list.reduce((s, o) => s + net(o), 0), orders: list.length, pos: list.filter((o) => o.source === "POS").reduce((s, o) => s + net(o), 0) });
  }
  return out;
}
function barChart(series, { height = 220, stacked = false } = {}) {
  const W = 720, H = height, L = 48, B = 26, T = 12;
  const max = Math.max(...series.map((s) => s.revenue), 1);
  const step = niceStep(max / 4);
  const top = Math.ceil(max / step) * step;
  const bw = (W - L - 8) / series.length;
  const y = (v) => T + (H - T - B) * (1 - v / top);
  let g = "";
  for (let v = 0; v <= top; v += step) g += `<line x1="${L}" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L - 8}" y="${y(v) + 4}" text-anchor="end">${short(v)}</text>`;
  series.forEach((s, i) => {
    const x = L + i * bw + bw * 0.18, w = bw * 0.64;
    const last = i === series.length - 1;
    if (stacked) {
      g += `<rect x="${x}" y="${y(s.revenue)}" width="${w}" height="${y(0) - y(s.revenue)}" rx="2" fill="var(--warn)" opacity=".85"><title>Online ${money(s.revenue - s.pos)}</title></rect>`;
      g += `<rect x="${x}" y="${y(s.pos)}" width="${w}" height="${y(0) - y(s.pos)}" rx="2" fill="var(--brand)"><title>Tại quầy ${money(s.pos)}</title></rect>`;
    } else {
      g += `<rect x="${x}" y="${y(s.revenue)}" width="${w}" height="${y(0) - y(s.revenue)}" rx="3" fill="var(--brand)" opacity="${last ? 1 : 0.55}"><title>${new Date(s.day).toLocaleDateString("vi-VN")}: ${money(s.revenue)}</title></rect>`;
    }
    const every = series.length > 16 ? Math.ceil(series.length / 8) : 1;
    if ((i % every === 0 && series.length - 1 - i >= Math.ceil(every / 2)) || last) {
      const d = new Date(s.day);
      g += `<text x="${x + w / 2}" y="${H - 8}" text-anchor="middle" ${last ? 'font-weight="600" style="fill:var(--fg)"' : ""}>${d.getDate()}/${d.getMonth() + 1}</text>`;
    }
  });
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Biểu đồ doanh thu theo ngày">${g}</svg></div>`;
}
const LEGEND = `<div class="legend"><span><span class="dot" style="background:var(--brand)"></span> Tại quầy</span><span><span class="dot" style="background:var(--warn)"></span> Online</span></div>`;
function progressRows(rows, total) {
  const max = Math.max(...rows.map((x) => x.value), 1);
  return rows.map((x) => `<div class="bar-row"><span>${x.label}${x.sub ? ` <span style="color:var(--muted)">· ${x.sub}</span>` : ""}</span><b class="num">${money(x.value)}${total ? ` <span style="color:var(--muted);font-weight:500">(${Math.round((x.value / total) * 100)}%)</span>` : ""}</b><div class="bar-track"><div class="bar-fill" style="width:${(x.value / max) * 100}%"></div></div></div>`).join("");
}
function niceStep(raw) {
  const p = Math.pow(10, Math.floor(Math.log10(raw)));
  for (const m of [1, 2, 2.5, 5, 10]) if (raw <= m * p) return m * p;
  return 10 * p;
}
function topProducts(orders, n = 5) {
  const map = new Map();
  for (const o of orders) for (const it of o.items) {
    const e = map.get(it.pid) ?? { name: it.name, qty: 0, revenue: 0 };
    e.qty += soldQty(it); e.revenue += soldQty(it) * it.price; map.set(it.pid, e);
  }
  return [...map.values()].sort((a, b) => b.revenue - a.revenue).slice(0, n);
}

    <div class="card kpi"><span class="l">Cần nhập thêm</span><span class="v num ${low.length ? "down" : ""}">${low.length} mặt hàng</span><span class="h">Tồn bằng hoặc dưới ngưỡng cảnh báo</span></div>

    </div></div>
  </div>
  <div class="card" style="margin-top:16px"><div class="card-h"><h3>Bán chạy 7 ngày qua</h3></div><div class="card-b">
    ${top.map((t) => `<div class="bar-row"><span>${esc(t.name)} <span style="color:var(--muted)">· ${t.qty} sp</span></span><b class="num">${money(t.revenue)}</b><div class="bar-track"><div class="bar-fill" style="width:${(t.revenue / maxTop) * 100}%"></div></div></div>`).join("")}
  </div></div>`;

function stockPill(p) {
  if (p.qty <= 0) return `<span class="pill bad">Hết hàng</span>`;

// Mô phỏng cổng biến động số dư: ngân hàng gọi webhook kèm chữ ký; máy chủ kiểm chữ ký, đọc mã đơn trong nội dung,
// so số tiền rồi tự hoàn tất đơn. Thu ngân chỉ thấy hộp chờ chuyển sang "Đã nhận tiền".
async function simulateTransfer() {
  const { due } = cartTotals();
  const code = ui.payCode;
  const at = Date.now();
  const tx = { id: "FT" + ymd(new Date(at)).slice(2) + String(Math.floor(Math.random() * 1e8)).padStart(8, "0"), at, amount: due, content: `${code.replace("-", "")} ${(me().name === "Lê Minh Châu" ? "NGUYEN THU HA" : "TRAN QUOC BAO")} chuyen khoan`, status: "MATCHED", order: null, auto: true };
  const body = bankPayload(tx);
  tx.signature = await hmacHex(body, S.bankSecret);
  const el = document.getElementById("pay-wait");
  if (el) { el.className = "wait ok"; el.innerHTML = `<span>✓</span><span>Ngân hàng báo có <b>+${money(due)}</b>, nội dung chứa <b>${code}</b>, mã GD ${tx.id}. Đang hoàn tất đơn…</span>`; }
  document.querySelectorAll('[data-act="sim-transfer"],[data-act="confirm-pay"]').forEach((b) => (b.disabled = true));
  setTimeout(() => { if (codeInContent(tx.content) === code) checkout("VIETQR", undefined, { code, tx }); }, 1100);
}
function bankPayload(tx) {
  const d = new Date(tx.at), p = (n) => String(n).padStart(2, "0");

}

function submitReturn() {
  const R = ui.ret, o = S.orders.find((x) => x.code === R.code);
  const amount = refundAmount(o, R.qty);
  const pointsBack = o.pointsEarned ? Math.round((o.pointsEarned * amount) / o.total) : 0;
  const prefix = "TH" + ymd(new Date());
  const code = prefix + "-" + String(S.returns.filter((x) => x.code.startsWith(prefix)).length + 1).padStart(3, "0");
  const items = o.items.filter((it) => R.qty[it.pid]).map((it) => ({ pid: it.pid, name: it.name, qty: R.qty[it.pid], amount: Math.round((it.price * R.qty[it.pid] * o.total) / o.subtotal / 100) * 100 }));
  for (const x of items) { const it = o.items.find((i) => i.pid === x.pid); it.ret = (it.ret || 0) + x.qty; if (R.restock) moveStock(x.pid, x.qty, "RETURN", code); }
  o.refunded = (o.refunded || 0) + amount;
  const c = o.customer && S.customers.find((x) => x.id === o.customer);
  if (c) { c.spent -= amount; c.points = Math.max(0, c.points - pointsBack); }
  const ret = { code, order: o.code, at: Date.now(), items, amount, reason: R.reason, restock: R.restock, method: R.method, staff: me().name, customer: o.customer, pointsBack };
  S.returns.unshift(ret);
  ui.ret = null;
  save();
  if (ret.method === "EXCHANGE") {
    ui.exchange = { code, amount }; ui.customer = o.customer ?? null; ui.cart = [];
    closeModal(); go("pos"); render();
    toast(`Đã lưu ${code}. Chọn hàng đổi, ${money(amount)} sẽ trừ vào đơn mới`);
  } else { render(); openReturnSlip(code); }
}

  modal(`<div class="dialog" role="dialog" aria-modal="true" aria-label="Phiếu trả hàng">

      ${id ? "" : `<label class="field"><span>Tồn đầu kỳ</span><input id="f-qty" class="input num" inputmode="numeric" value="0"></label>`}
      <p id="f-err" class="down" style="margin:0" hidden></p>
      <button class="btn lg" type="submit">${id ? "Lưu thay đổi" : "Thêm sản phẩm"}</button>
    </div></form></div>`);

  document.getElementById("f-image").addEventListener("change", async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    try {
      const bmp = await createImageBitmap(file);
      const size = 240, c = document.createElement("canvas"); c.width = c.height = size;
      const k = Math.max(size / bmp.width, size / bmp.height);
      c.getContext("2d").drawImage(bmp, (size - bmp.width * k) / 2, (size - bmp.height * k) / 2, bmp.width * k, bmp.height * k);
      ui.draftImage = c.toDataURL("image/jpeg", 0.8);
      document.getElementById("f-thumb").innerHTML = thumb({ ...p, image: ui.draftImage }, "lg");
    } catch { toast("Không đọc được ảnh này"); }
  });
  document.getElementById("pform").addEventListener("submit", (e) => {
    e.preventDefault();
    const v = (k) => document.getElementById("f-" + k).value.trim();
    const err = (m) => { const el = document.getElementById("f-err"); el.textContent = m; el.hidden = false; };

    if (!price) return err("Giá bán phải lớn hơn 0");
    if (S.products.some((x) => x.sku === sku && x.id !== id)) return err(`Mã SKU ${sku} đã tồn tại`);
    const data = { name: v("name"), sku, barcode: v("barcode"), cat: v("cat"), unit: v("unit") || "cái", price, cost };
    if (ui.draftImage !== undefined) data.image = ui.draftImage;
    if (id) Object.assign(prod(id), data);
    else {
      const np = { id: "p" + Date.now(), ...data, qty: 0, threshold: 10, active: true };
      S.products.push(np);
      const q0 = Number(v("qty")) || 0;
      if (q0 > 0) moveStock(np.id, q0, "RECEIPT", "Tồn đầu kỳ");
    }
    save(); closeModal(); toast(id ? "Đã lưu sản phẩm" : `Đã thêm ${data.name}`); render();
  });
}

  return head("Tồn kho", low ? `${low} sản phẩm cần nhập thêm` : "Không có sản phẩm nào sắp hết") + `
  <div class="tabs">${[["stock", "Tồn kho"], ["history", "Sổ biến động kho"]].map(([k, l]) => `<button class="${tab === k ? "on" : ""}" data-act="tab" data-scope="inventory" data-tab="${k}">${l}</button>`).join("")}</div>

    <div class="card-h"><h3>${mode === "receive" ? "Nhập kho" : "Kiểm kê"}: ${esc(p.name)}</h3><button type="button" class="btn ghost sm" data-act="close">Đóng</button></div>

  });
}

// ===================== Báo cáo =====================
function reportsView() {
  const own = !can("report.view");
  const filter = own ? (o) => o.staff === me().name : () => true;
  const days = ui.days;
  const since = startOfDay(Date.now()) - (days - 1) * 86400000;
  const list = paid().filter((o) => o.at >= since && filter(o));
  const revenue = list.reduce((s, o) => s + net(o), 0);
  const discount = list.reduce((s, o) => s + o.discount, 0);
  const refunded = list.reduce((s, o) => s + (o.refunded || 0), 0);
  const cogs = list.reduce((s, o) => s + o.items.reduce((a, it) => a + soldQty(it) * it.cost, 0), 0);
  const profit = revenue - cogs;
  const group = (key) => Object.values(list.reduce((m, o) => { const k = key(o); if (k == null) return m; (m[k] ??= { k, value: 0, count: 0 }); m[k].value += net(o); m[k].count++; return m; }, {})).sort((a, b) => b.value - a.value);
  const bySource = group((o) => o.source);
  const byMethod = group((o) => o.method);
  const byStaff = group((o) => o.staff);
  const prodMap = new Map();
  for (const o of list) for (const it of o.items) {
    const e = prodMap.get(it.pid) ?? { name: it.name, unit: prod(it.pid)?.unit ?? "", qty: 0, value: 0, profit: 0 };
    e.qty += soldQty(it); e.value += soldQty(it) * it.price; e.profit += soldQty(it) * (it.price - it.cost); prodMap.set(it.pid, e);
  }
  const top = [...prodMap.values()].sort((a, b) => b.value - a.value).slice(0, 10);
  const seg = `<div class="seg" role="group" aria-label="Khoảng thời gian">${[7, 30, 90].map((d) => `<button class="${d === days ? "on" : ""}" data-act="days" data-d="${d}">${d} ngày</button>`).join("")}</div>`;
  return head("Báo cáo doanh thu", own ? `Doanh thu các đơn ${esc(me().name)} bán, ${days} ngày gần nhất` : `${days} ngày gần nhất, chỉ tính đơn đã thanh toán`, seg) + `
  <div class="grid kpis">
    <div class="card kpi"><span class="l">Doanh thu</span><span class="v num">${money(revenue)}</span><span class="h">${list.length} đơn đã thanh toán</span></div>
    ${own ? `<div class="card kpi"><span class="l">Số đơn</span><span class="v num">${list.length}</span><span class="h">Không hiện lợi nhuận với vai trò thu ngân</span></div>`
      : `<div class="card kpi"><span class="l">Lợi nhuận gộp</span><span class="v num">${money(profit)}</span><span class="h">Biên ${revenue ? Math.round((profit / revenue) * 100) : 0}%, theo giá vốn lúc bán</span></div>`}
    <div class="card kpi"><span class="l">Giá trị đơn trung bình</span><span class="v num">${money(list.length ? Math.round(revenue / list.length) : 0)}</span><span class="h">&nbsp;</span></div>
    <div class="card kpi"><span class="l">Trung bình mỗi ngày</span><span class="v num">${money(Math.round(revenue / days))}</span><span class="h">Đã giảm giá ${money(discount)} · hoàn trả ${money(refunded)}</span></div>
  </div>
  <div class="card" style="margin-top:16px"><div class="card-h"><h3>Doanh thu theo ngày</h3>${LEGEND}</div>
    <div class="card-b">${barChart(dailySeries(days, filter), { stacked: true })}</div></div>
  <div class="grid two" style="margin-top:16px">
    <div class="card"><div class="card-h"><h3>Top sản phẩm</h3></div><div class="card-b">${top.length ? progressRows(top.map((t) => ({ label: esc(t.name), sub: `${t.qty} ${t.unit}${own ? "" : ` · lãi ${vnd.format(t.profit)} ₫`}`, value: t.value }))) : '<div class="empty">Chưa có dữ liệu</div>'}</div></div>
    <div style="display:grid;gap:16px;align-content:start">
      <div class="card"><div class="card-h"><h3>Theo kênh bán</h3></div><div class="card-b">${progressRows(bySource.map((x) => ({ label: SOURCE_LABEL[x.k], sub: `${x.count} đơn`, value: x.value })), revenue) || '<div class="empty">Chưa có dữ liệu</div>'}</div></div>
      <div class="card"><div class="card-h"><h3>Theo hình thức thanh toán</h3></div><div class="table-wrap"><table><thead><tr><th>Hình thức</th><th class="r">Số giao dịch</th><th class="r">Số tiền</th></tr></thead><tbody>
        ${byMethod.map((x) => `<tr><td>${METHOD_LABEL[x.k]}</td><td class="r num">${x.count}</td><td class="r num">${money(x.value)}</td></tr>`).join("")}</tbody></table></div></div>
      ${own ? "" : `<div class="card"><div class="card-h"><h3>Theo nhân viên bán tại quầy</h3></div><div class="table-wrap"><table><thead><tr><th>Nhân viên</th><th class="r">Số đơn</th><th class="r">Doanh thu</th></tr></thead><tbody>
        ${byStaff.map((x) => `<tr><td>${esc(x.k)}</td><td class="r num">${x.count}</td><td class="r num">${money(x.value)}</td></tr>`).join("")}</tbody></table></div></div>`}
    </div>
  </div>`;
}

const fold = (s) => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/đ/g, "d");

// Bản demo: đoán ý định theo từ khóa, rồi tính câu trả lời từ dữ liệu thật của demo.
// Bản thật: gửi câu hỏi cho Claude kèm danh sách công cụ báo cáo (tool use), Claude tự chọn công cụ và viết câu trả lời.
function answer(q) {
  const f = fold(q);
  const has = (...w) => w.some((x) => f.includes(x));
  if (has("mo ta", "viet ", "content", "quang cao")) return aDescribe(q);
  if (has("cham", "ban e", "it ban", "khong ban", "ton dong")) return aSlow();
  if (has("nhap", "sap het", "het hang", "ton kho", "dat hang")) return aReorder();
  if (has("so sanh", "tuan truoc", "thang truoc")) return aCompare(has("thang"));
  if (has("gio nao", "khung gio", "cao diem", "dong khach", "may gio")) return aHours();
  if (has("khach")) return aCustomers();
  if (has("khuyen mai", "km", "voucher", "ma giam")) return aPromos();
  if (has("kenh", "online", "shopee", "tiktok", "lazada", "san")) return aChannels();
  if (has("loi nhuan", "lai", "bien")) return aProfit();
  if (has("tra hang", "hoan tien", "doi tra")) return aReturns();
  if (has("chuyen khoan", "doi soat", "qr")) return aBank();
  if (has("ban chay", "top", "chay nhat")) return aTop(has("thang") ? 30 : 7);
  if (has("hom qua")) return aDay(1);
  if (has("hom nay", "doanh thu", "ban duoc", "bao nhieu")) return has("thang") ? aCompare(true) : has("tuan") ? aCompare(false) : aDay(0);
  return { tools: [], html: `<p>Tôi chưa chắc bạn muốn hỏi gì. Bản demo đang trả lời được các câu về:</p><ul><li>doanh thu hôm nay, hôm qua, tuần, tháng và so sánh</li><li>hàng bán chạy, bán chậm, gợi ý nhập hàng</li><li>khách hàng thân thiết, khuyến mãi, kênh online, trả hàng, giờ cao điểm</li><li>viết mô tả sản phẩm</li></ul><p>Bản thật dùng Claude nên hiểu được câu hỏi tự do hơn.</p>` };

function aDay(back) {

function aSlow() {

function aReorder() {

function modal(html) { document.getElementById("modal").innerHTML = `<div class="overlay" data-act="overlay">${html}</div>`; }
function closeModal() { document.getElementById("modal").innerHTML = ""; }

// ===================== Sự kiện =====================
document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-act]");
  if (!t) return;
  const a = t.dataset.act;
  if (a === "overlay") { if (e.target === t) closeModal(); return; }
  if (t.tagName === "A" || t.tagName === "BUTTON") e.preventDefault();
  switch (a) {
    case "login": S.user = t.dataset.id; ui.cart = []; save(); location.hash = ""; render(); break;
    case "logout": S.user = null; save(); closeModal(); render(); break;
    case "reset": { const u = S.user; S = seedState(); S.user = u; ui.cart = []; save(); toast("Đã khôi phục dữ liệu mẫu"); render(); break; }
    case "cat": ui.cat = t.dataset.cat; render(); break;
    case "add": addToCart(t.dataset.id); break;
    case "dec": { const l = ui.cart.find((x) => x.pid === t.dataset.id); l.qty--; if (!l.qty) ui.cart = ui.cart.filter((x) => x !== l); render(); break; }
    case "clear": ui.cart = []; ui.discountPct = 0; render(); break;
    case "demo-scan": { const pool = S.products.filter((p) => p.qty > 0); const p = pool[Math.floor(Math.random() * pool.length)]; toast(`Quét ${p.barcode}: ${p.name}`); addToCart(p.id); break; }
    case "pay": openPay(); break;
    case "method": ui.payMethod = t.dataset.m; openPay(); break;
    case "cash": ui.cashGiven = t.dataset.v; openPay(); break;
    case "confirm-pay": { const given = Number(String(ui.cashGiven).replace(/\D/g, "")) || cartTotals().due; checkout(ui.payMethod, ui.payMethod === "CASH" ? given : undefined, { code: ui.payCode }); break; }
    case "sim-transfer": simulateTransfer(); break;
    case "cust-pick": ui.customer = t.dataset.id; ui.custQ = ""; ui.usePoints = false; render(); break;
    case "cust-clear": ui.customer = null; ui.usePoints = false; render(); break;
    case "cust-new": openCustomerForm(null, ui.custQ.trim()); break;
    case "new-customer": openCustomerForm(null, ""); break;
    case "edit-customer": openCustomerForm(t.dataset.id); break;
    case "customer": openCustomer(t.dataset.id); break;
    case "cfilter": ui.custFilter = t.dataset.f; render(); break;
    case "exchange-clear": ui.exchange = null; render(); toast("Đã bỏ trừ phiếu trả; tiền hoàn trả khách bằng tiền mặt"); break;
    case "return": openReturn(t.dataset.code, true); break;
    case "ret-inc": case "ret-dec": { const it = S.orders.find((o) => o.code === ui.ret.code).items.find((x) => x.pid === t.dataset.id); const cur = ui.ret.qty[it.pid] || 0; ui.ret.qty[it.pid] = Math.max(0, Math.min(it.qty - (it.ret || 0), cur + (a === "ret-inc" ? 1 : -1))); openReturn(ui.ret.code); break; }
    case "ret-all": { const o = S.orders.find((x) => x.code === ui.ret.code); for (const it of o.items) ui.ret.qty[it.pid] = it.qty - (it.ret || 0); openReturn(o.code); break; }
    case "ret-method": ui.ret.method = t.dataset.m; openReturn(ui.ret.code); break;
    case "ret-submit": submitReturn(); break;
    case "return-slip": openReturnSlip(t.dataset.code); break;
    case "txfilter": ui.txFilter = t.dataset.f; render(); break;
    case "tx-match": openTxMatch(t.dataset.id); break;
    case "tx-link": linkTx(t.dataset.id, t.dataset.code); break;
    case "tx-ignore": { const tx = S.bankTx.find((x) => x.id === t.dataset.id); tx.status = "IGNORED"; tx.note = "Không thuộc đơn bán hàng"; save(); closeModal(); toast("Đã đánh dấu không thuộc đơn nào"); render(); break; }
    case "tx-payload": openTxPayload(t.dataset.id); break;
    case "ask": if (ui.view !== "assistant") go("assistant"); askAssistant(t.dataset.q); break;
    case "ask-go": { const q = document.getElementById("ai-q")?.value.trim(); if (q) { if (ui.view !== "assistant") go("assistant"); askAssistant(q); } break; }
    case "chat-reset": ui.chat = []; render(); break;
    case "close": closeModal(); if (ui.view === "pos") document.getElementById("scan")?.focus(); break;
    case "ofilter": ui.orderFilter = t.dataset.f; render(); break;
    case "order": openOrder(t.dataset.code); break;
    case "cancel-order": cancelOrder(t.dataset.code); break;
    case "new-product": openProduct(null); break;
    case "edit-product": openProduct(t.dataset.id); break;
    case "tab": ui.tab[t.dataset.scope] = t.dataset.tab; render(); break;
    case "receive": openStock(t.dataset.id, "receive"); break;
    case "count": openStock(t.dataset.id, "count"); break;
    case "toggle-staff": { const u = S.staff.find((x) => x.id === t.dataset.id); u.active = !u.active; save(); toast(u.active ? `Đã mở khóa ${u.name}` : `Đã khóa ${u.name}`); render(); break; }
    case "connect": { const c = S.channels[t.dataset.ch]; Object.assign(c, { connected: true, since: Date.now(), secret: randomHex(24) }); save(); toast(`Đã kết nối ${CHANNEL_INFO[t.dataset.ch].name}, đã cấp secret webhook mới`); render(); break; }
    case "disconnect": S.channels[t.dataset.ch].connected = false; save(); toast(`Đã ngắt ${CHANNEL_INFO[t.dataset.ch].name}, đơn mới từ sàn sẽ bị từ chối`); render(); break;
    case "mapping": openMapping(t.dataset.ch); break;
    case "automap": { const ch = t.dataset.ch, c = S.channels[ch]; let n = 0; for (const p of S.products) if (p.active && !c.map[p.id]) { c.map[p.id] = PLATFORM[ch].prefix + "-" + p.sku; n++; } save(); toast(`Đã liên kết thêm ${n} sản phẩm`); render(); openMapping(ch); break; }
    case "save-store": saveStore(); break;
    case "ifilter": ui.invFilter = t.dataset.f; render(); break;
    case "new-promo": openPromo(null); break;
    case "edit-promo": openPromo(t.dataset.id); break;
    case "toggle-promo": { const k = S.promos.find((x) => x.id === t.dataset.id); k.active = !k.active; save(); toast(k.active ? `Đã bật lại ${k.name}` : `Đã tạm dừng ${k.name}`); render(); break; }
    case "clear-image": ui.draftImage = null; document.getElementById("f-thumb").innerHTML = thumb({ ...ui.editing, image: null }, "lg"); t.remove(); break;
    case "go-settings": closeModal(); go("settings"); break;
    case "days": ui.days = Number(t.dataset.d); render(); break;
    case "sim": simulateOnlineOrder(t.dataset.ch); break;
  }
});
document.addEventListener("change", (e) => {
  const t = e.target;
  if (t.id === "discount") { ui.discountPct = Number(t.value); render(); }
  if (t.id === "use-points") { ui.usePoints = t.checked; render(); }
  if (t.id === "ret-reason") { ui.ret.reason = t.value; ui.ret.restock = t.value !== RETURN_REASONS[0] && t.value !== RETURN_REASONS[3]; openReturn(ui.ret.code); }
  if (t.id === "ret-restock") { ui.ret.restock = t.checked; }
  if (t.dataset.act === "sku") {
    const c = S.channels[t.dataset.ch], sku = t.value.trim();
    const clash = sku && Object.entries(c.map).find(([pid, v]) => v === sku && pid !== t.dataset.id);
    if (clash) { toast(`SKU ${sku} đã gán cho ${prod(clash[0]).name}`); t.value = c.map[t.dataset.id] ?? ""; return; }
    if (sku) c.map[t.dataset.id] = sku; else delete c.map[t.dataset.id];
    save(); toast(sku ? "Đã lưu liên kết" : "Đã bỏ liên kết"); render();
  }
  if (t.dataset.act === "role") { const u = S.staff.find((x) => x.id === t.dataset.id); u.role = t.value; save(); toast(`${u.name} giờ là ${S.roles[u.role].name}`); render(); }
  if (t.dataset.act === "perm") {
    const r = S.roles[t.dataset.role];
    r.perms = t.checked ? [...r.perms, t.dataset.perm] : r.perms.filter((p) => p !== t.dataset.perm);
    save(); toast("Đã lưu phân quyền");
  }
});
document.addEventListener("input", (e) => {
  const t = e.target;
  if (t.id === "scan") { ui.q = t.value; const pos = t.selectionStart; render(); const el = document.getElementById("scan"); el.focus(); el.setSelectionRange(pos, pos); }
  for (const [id, key] of [["oq", "orderQ"], ["iq", "invQ"], ["voucher", "voucher"], ["cphone", "custQ"], ["clq", "custListQ"]]) if (t.id === id) { ui[key] = t.value; const pos = t.selectionStart; render(); const el = document.getElementById(id); el.focus(); el.setSelectionRange(pos, pos); }
  if (t.id === "pq") { ui.productQ = t.value; const pos = t.selectionStart; render(); const el = document.getElementById("pq"); el.focus(); el.setSelectionRange(pos, pos); }
  if (t.id === "cash") {
    ui.cashGiven = t.value.replace(/\D/g, "");
    const total = cartTotals().due, given = Number(ui.cashGiven) || 0;
    const out = t.closest(".card-b").querySelector(".total .num");
    out.textContent = given ? (given >= total ? money(given - total) : "Chưa đủ") : "—";
    out.classList.toggle("down", !!given && given < total);
    t.closest(".card-b").querySelector('[data-act="confirm-pay"]').disabled = !!given && given < total;
  }
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") closeModal();
  if (e.key === "Enter" && e.target.id === "ai-q") { const q = e.target.value.trim(); if (q) { if (ui.view !== "assistant") go("assistant"); askAssistant(q); } }
  if (e.key === "Enter" && e.target.id === "scan") {
    const q = ui.q.trim().toLowerCase();
    const exact = S.products.find((p) => p.barcode === q || p.sku.toLowerCase() === q);
    const matches = S.products.filter((p) => p.active && p.name.toLowerCase().includes(q));
    const hit = exact ?? (matches.length === 1 ? matches[0] : null);
    if (hit) { ui.q = ""; addToCart(hit.id); }
  }
});
window.addEventListener("hashchange", render);
render();
</script>
